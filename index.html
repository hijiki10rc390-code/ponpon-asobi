/* =====================================================================
   HiDPI Canvas セットアップ
   ===================================================================== */
function setupHiDPICanvas(cv, cssSize) {
  const dpr = window.devicePixelRatio || 1;
  cv.width  = cssSize * dpr;
  cv.height = cssSize * dpr;
  cv.style.width = cssSize + "px";
  cv.style.height = cssSize + "px";
  const ctx2d = cv.getContext("2d");
  ctx2d.scale(dpr, dpr);
  return ctx2d;
}
function setupModeCanvas(cv) {
  // モード用 Canvas は親サイズに追従
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width  = Math.max(1, Math.floor(w * dpr));
    cv.height = Math.max(1, Math.floor(h * dpr));
    const ctx2d = cv.getContext("2d");
    ctx2d.setTransform(1,0,0,1,0,0);
    ctx2d.scale(dpr, dpr);
  }
  resize();
  return resize;
}

/* =====================================================================
   全画面化（最初のタップで試行、失敗は無視）
   - iPadOS Safari は documentElement.requestFullscreen を持つが、pointerdown 内で呼ぶと
     全画面遷移で最初のタップごと消えることがある。また「ホーム画面に追加して起動」
     （standalone）ならすでに全画面相当なので、何もしなくてよい。
   - iPad 実機では全画面化を呼ばない。判定は「複数タッチ対応 + iOS/Mac を名乗る UA」。
   ===================================================================== */
let fullscreenTried = false;
// ホーム画面から起動済み（standalone）なら全画面化不要
function isStandaloneDisplay() {
  try {
    if (window.navigator && window.navigator.standalone === true) return true;
  } catch (err) { /* ignore */ }
  try {
    if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
  } catch (err) { /* ignore */ }
  return false;
}
// iPad / iPhone 実機かどうか（PC の Chrome は UA に Macintosh が無いので false）
function isLikelyIOSDevice() {
  try {
    if (!(navigator.maxTouchPoints > 1)) return false;
    return /iPad|iPhone|iPod|Macintosh|Mac OS X/i.test(navigator.userAgent || "");
  } catch (err) { return false; }
}
function tryFullscreen() {
  if (fullscreenTried) return;
  // すでに全画面相当、または iPad 実機なら何もしない（初回タップを潰さない）
  if (isStandaloneDisplay() || isLikelyIOSDevice()) { fullscreenTried = true; return; }
  fullscreenTried = true;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) return;
  try {
    const ret = req.call(el);
    // Promise を返す実装ではユーザー操作なしだと reject する。未処理拒否を出さない
    if (ret && typeof ret.catch === "function") ret.catch(() => {});
  } catch (err) { /* 失敗を無視 */ }
}

/* =====================================================================
   モード：どうぶつ
   ===================================================================== */
let animalIndex = 0;
let animalTapCount = 0;
let animalAnim = { active:false, t0:0, dur:0.45, kind:"bounce" };

function initAnimal() {
  const elEmo = document.getElementById("animal-emoji");
  animalIndex = Math.floor(Math.random() * SoundKit.animals.length);
  animalTapCount = 0;
  elEmo.style.transform = "scale(1)";
  renderAnimal();
  const cv = document.getElementById("animal-canvas");
  const onResize = setupModeCanvas(cv);
  bindResize(onResize);
  loopAnimal(cv);
}
function renderAnimal() {
  const a = SoundKit.animals[animalIndex];
  document.getElementById("animal-emoji").textContent = a.emo;
}
function triggerAnimalAnim(kind) {
  animalAnim.active = true;
  animalAnim.kind = kind;
  animalAnim.t0 = performance.now();
  animalAnim.dur = kind === "bounce" ? 0.45 : 0.55;
}
function loopAnimal(cv) {
  const ctx2d = cv.getContext("2d");
  function frame() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx2d.clearRect(0, 0, w, h);
    // きらきら粒
    updateParticles(1/60);
    drawParticles(ctx2d);
    // 絵文字のスケール（アニメ）
    const elEmo = document.getElementById("animal-emoji");
    if (animalAnim.active) {
      const t = (performance.now() - animalAnim.t0) / 1000;
      if (t > animalAnim.dur) {
        animalAnim.active = false;
        elEmo.style.transform = "scale(1)";
      } else {
        const u = t / animalAnim.dur;
        let s = 1;
        if (animalAnim.kind === "bounce") {
          // 1 → 1.3 → 1（イーズアウト）
          s = 1 + 0.3 * Math.sin(Math.PI * u);
        } else {
          // つぶれる（1 → 0.8 → 1、横にも少し効くよう X 軸も）
          s = 1 - 0.2 * Math.sin(Math.PI * u);
        }
        elEmo.style.transform = `scale(${s.toFixed(3)})`;
      }
    }
    if (currentMode === "animal") requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* どうぶつのタップ処理：HTML 側にアタッチ */
function setupAnimalTap() {
  const stage = document.getElementById("stage-animal");
  const elEmo = document.getElementById("animal-emoji");

  function tap(x, y, isEmoji) {
    // 絵文字タップ → 弾む/つぶれる + 鳴き声 + 読み上げ → 3 回で次の動物へ
    // 背景タップ → 鳴き声/読み上げなし、効果音だけ → 即座に次の動物へ
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    const cv = document.getElementById("animal-canvas");
    const r = cv.getBoundingClientRect();
    if (isEmoji) {
      // 弾む（bounce）+ つぶれる（squash）を交互
      triggerAnimalAnim(animalTapCount % 2 === 0 ? "bounce" : "squash");
      SoundKit.playAnimal(animalIndex);
      spawnParticles(x - r.left, y - r.top,
        ["#ffd166","#ef476f","#06d6a0","#118ab2","#fff"][animalIndex % 5],
        30);
      animalTapCount++;
      if (animalTapCount >= 3) {
        animalTapCount = 0;
        animalIndex = (animalIndex + 1) % SoundKit.animals.length;
        setTimeout(renderAnimal, 120);
      }
    } else {
      // 背景タップ → 効果音だけ鳴らして次の動物へ
      SoundKit.playTwinkle();
      animalTapCount = 0;
      animalIndex = (animalIndex + 1) % SoundKit.animals.length;
      renderAnimal();
    }
  }

  function getXY(e) {
    if (e.touches && e.touches[0]) return {x: e.touches[0].clientX, y: e.touches[0].clientY};
    return {x: e.clientX, y: e.clientY};
  }

  function onDown(e) {
    e.preventDefault();
    // 手のひら相当の接触は無視（複数本指のタップや通常のタップはそのまま）
    if (isPalmTouch(e)) return;
    const {x, y} = getXY(e);
    const r = elEmo.getBoundingClientRect();
    const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    tap(x, y, inside);
  }
  stage.addEventListener("pointerdown", onDown, {passive:false});
  stage.addEventListener("click", e => {
    // pointerdown で処理しているので click は抑止（二重発火防止）
    e.preventDefault();
  });
}

/* =====================================================================
   モード：ふうせん
   ===================================================================== */
const BALLOON_COLORS = [
  { name: "あか",     hex: "#ff5a5f" },
  { name: "あお",     hex: "#3a86ff" },
  { name: "きいろ", hex: "#ffd60a" },
  { name: "みどり",   hex: "#06d6a0" },
  { name: "むらさき", hex: "#9b5de5" },
  { name: "ピンク",   hex: "#ff80aa" },
  { name: "オレンジ", hex: "#fb8500" },
  { name: "みずいろ", hex: "#00b4d8" },
];
const balloons = [];
let balloonLastSpawn = 0;
const BALLOON_MAX_ALIVE = 12;             // 同時表示の上限

function initBalloon() {
  balloons.length = 0;
  balloonLastSpawn = performance.now();
  const cv = document.getElementById("balloon-canvas");
  const onResize = setupModeCanvas(cv);
  bindResize(onResize);
  loopBalloon(cv);
}

function spawnBalloon(x, y) {
  // 同時表示の上限チェック
  if (balloons.filter(b => b.alive).length >= BALLOON_MAX_ALIVE) return;
  const c = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
  // 半径は画面短辺の 9〜14%（1歳児でも指で届くサイズ）
  const base = Math.min(window.innerWidth, window.innerHeight);
  const r = base * (0.09 + Math.random() * 0.05);
  balloons.push({
    x: x != null ? x : Math.random() * (window.innerWidth),
    y: y != null ? y : window.innerHeight + r + 20,
    r,
    color: c.hex,
    name: c.name,
    vx: (Math.random() - 0.5) * 8,
    vy: -60 - Math.random() * 40,
    sway: Math.random() * Math.PI * 2,
    swaySpd: 1.6 + Math.random() * 1.2,
    alive: true,
  });
}
function updateBalloons(dt, w, h) {
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    if (!b.alive) { balloons.splice(i, 1); continue; }
    b.sway += b.swaySpd * dt;
    b.x += b.vx * dt + Math.sin(b.sway) * 4 * dt * 60 / 60;
    b.y += b.vy * dt;
    // 上に消えたら除去
    if (b.y + b.r < -20) { balloons.splice(i, 1); continue; }
  }
}
function drawBalloons(ctx2d, w, h) {
  for (const b of balloons) {
    if (!b.alive) continue;

    // ひも（半径に比例：r/4 横振り + r*1.4 縦長さ）
    ctx2d.save();
    ctx2d.strokeStyle = "rgba(0,0,0,.35)";
    ctx2d.lineWidth = 1.5;
    ctx2d.beginPath();
    ctx2d.moveTo(b.x, b.y + b.r);
    ctx2d.quadraticCurveTo(
      b.x + b.r * 0.25, b.y + b.r + b.r * 0.7,
      b.x, b.y + b.r + b.r * 1.4);
    ctx2d.stroke();
    ctx2d.restore();

    // 球
    const grad = ctx2d.createRadialGradient(
      b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.2,
      b.x, b.y, b.r);
    grad.addColorStop(0, "rgba(255,255,255,.6)");
    grad.addColorStop(1, b.color);
    ctx2d.fillStyle = grad;
    ctx2d.beginPath();
    ctx2d.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx2d.fill();
  }
}

function loopBalloon(cv) {
  const ctx2d = cv.getContext("2d");
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const w = cv.clientWidth, h = cv.clientHeight;

    // 自然発生（0.6 秒に 1 個程度）
    if (now - balloonLastSpawn > 600) {
      spawnBalloon();
      balloonLastSpawn = now;
    }

    updateBalloons(dt, w, h);
    ctx2d.clearRect(0, 0, w, h);
    drawBalloons(ctx2d, w, h);
    updateParticles(dt);
    drawParticles(ctx2d);

    if (currentMode === "balloon") requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function setupBalloonTap() {
  const cv = document.getElementById("balloon-canvas");
  function getXY(e) {
    if (e.touches && e.touches[0]) return {x: e.touches[0].clientX, y: e.touches[0].clientY};
    return {x: e.clientX, y: e.clientY};
  }
  function onDown(e) {
    e.preventDefault();
    // 手のひら相当の接触は無視
    if (isPalmTouch(e)) return;
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    const {x, y} = getXY(e);
    const r = cv.getBoundingClientRect();
    const lx = x - r.left, ly = y - r.top;
    // 風船に当たったか判定（当たり判定の余白も半径に比例）
    let hit = null;
    for (const b of balloons) {
      if (!b.alive) continue;
      const dx = lx - b.x, dy = ly - b.y;
      const pad = b.r * 0.2;
      if (dx*dx + dy*dy <= (b.r + pad) * (b.r + pad)) { hit = b; break; }
    }
    if (hit) {
      hit.alive = false;
      SoundKit.playPop();
      spawnParticles(hit.x, hit.y, hit.color, 40);
    } else {
      // 何もない所をタップ → そこに風船
      spawnBalloon(lx, ly);
      // 風船が出ると嬉しい音
      SoundKit.playTwinkle();
    }
  }
  cv.addEventListener("pointerdown", onDown, {passive:false});
  cv.addEventListener("click", e => e.preventDefault());
}

/* =====================================================================
   モード：いろ
   ===================================================================== */
const ripples = [];

function initColor() {
  ripples.length = 0;
  const cv = document.getElementById("color-canvas");
  const onResize = setupModeCanvas(cv);
  bindResize(onResize);
  loopColor(cv);
}

function triggerRipple(x, y, color) {
  // 最大半径は画面短辺の 25〜45% のランダム（どの方向でも画面からはみ出にくい）
  const base = Math.min(window.innerWidth, window.innerHeight);
  const max = base * (0.25 + Math.random() * 0.20);
  ripples.push({x, y, r: 0, max, life: 0, ttl: 0.9, color});
}

function loopColor(cv) {
  const ctx2d = cv.getContext("2d");
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const w = cv.clientWidth, h = cv.clientHeight;

    // 背景（黒）
    ctx2d.fillStyle = "#0b1020";
    ctx2d.fillRect(0, 0, w, h);

    // 波紋更新/描画
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life += dt;
      r.r = Math.min(r.max, r.r + dt * 240);   // max を超える膨らみは無効化
      if (r.life >= r.ttl) ripples.splice(i, 1);
    }
    for (const r of ripples) {
      const a = 1 - r.life / r.ttl;
      ctx2d.save();
      // 塗りつぶしの波紋（半透明 alpha 0.5 → 0 で消える）
      ctx2d.globalAlpha = a * 0.5;
      ctx2d.fillStyle = r.color;
      ctx2d.beginPath();
      ctx2d.arc(r.x, r.y, r.r, 0, Math.PI*2);
      ctx2d.fill();
      ctx2d.restore();
    }

    if (currentMode === "color") requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

const COLOR_BAND = [
  "#ff5a5f", // 赤
  "#3a86ff", // 青
  "#ffd60a", // 黄
  "#06d6a0", // 緑
  "#9b5de5", // 紫
];

function setupColorTap() {
  const cv = document.getElementById("color-canvas");
  let lastNoteAt = 0;
  // pointerId ごとに状態を持つ（複数本指で同時に異なる x をなぞれる）
  const pointers = new Map();

  function getXY(e) {
    if (e.touches && e.touches[0]) return {x: e.touches[0].clientX, y: e.touches[0].clientY};
    return {x: e.clientX, y: e.clientY};
  }

  function onDown(e) {
    e.preventDefault();
    // 手のひら相当の接触は無視
    if (isPalmTouch(e)) return;
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    const {x, y} = getXY(e);
    const r = cv.getBoundingClientRect();
    const lx = x - r.left, ly = y - r.top;
    pointers.set(e.pointerId, {lastX: lx, lastY: ly});
    onPoint(lx, ly, /*strong*/ true);
  }
  function onMove(e) {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    const {x, y} = getXY(e);
    const r = cv.getBoundingClientRect();
    const lx = x - r.left, ly = y - r.top;
    const dx = lx - p.lastX;
    p.lastX = lx; p.lastY = ly;
    if (Math.abs(dx) < 2) return;          // 同じ場所は無視（連打防止）
    onPoint(lx, ly, /*strong*/ false);
  }
  function onUp(e) {
    if (e && e.pointerId != null) pointers.delete(e.pointerId);
    if (e && e.preventDefault) e.preventDefault();
  }

  function onPoint(lx, ly, strong) {
    const w = cv.clientWidth;
    const xn = Math.max(0, Math.min(1, lx / w));
    const freq = SoundKit.noteForX(xn);
    const band = COLOR_BAND[Math.floor(xn * COLOR_BAND.length) % COLOR_BAND.length];
    const ctx2d = cv.getContext("2d");
    triggerRipple(lx, ly, band);
    const now = performance.now();
    if (strong) {
      SoundKit.playNote(freq);
      lastNoteAt = now;
    } else {
      // 連続して鳴ると耳が痛くならないよう 80ms 間隔で間引き
      // マルチタッチ時は複数の指で同時に strong が来るので、いずれか 1 つだけ通す
      if (now - lastNoteAt > 80) {
        SoundKit.playNoteSmall(freq);
        lastNoteAt = now;
      }
    }
  }

  cv.addEventListener("pointerdown", onDown, {passive:false});
  cv.addEventListener("pointermove", onMove, {passive:false});
  cv.addEventListener("pointerup",   onUp,   {passive:false});
  cv.addEventListener("pointercancel", onUp, {passive:false});
  // pointerleave は iOS で pointerup が来ない保険（家の終了時に map をクリア）
  cv.addEventListener("pointerleave", onUp, {passive:false});
  cv.addEventListener("click", e => e.preventDefault());
}

/* =====================================================================
   モード：おとあそび（鍵盤）
   - 白鍵 8 本（C4 D4 E4 F4 G4 A4 B4 C5）＋ 黒鍵 5 本（C#4 D#4 F#4 G#4 A#4）。
     本物のピアノと同じ配置（黒鍵は ド-レ間、レ-ミ間、ファ-ソ間、ソ-ラ間、ラ-シ間）。
   - data-note に SoundKit.musicScale のインデックス（音名順 0..12）を持たせる。
   - タップで音が鳴り、鍵が沈んでレインボー色に光る（180ms で戻る）。
   - マルチタッチOK（pointerId ごとに「いま押されている鍵」を管理）。
   - 掌は無視。ドラッグで鍵をまたいだら新しい鍵の音を鳴らす。
   ===================================================================== */
// インデックス = musicScale の音名順。白鍵 8 色 + 黒鍵 5 色（各黒鍵は濃い色）
const MUSIC_KEY_COLORS = [
  "#ff5a5f",  //  0  C4  ド      赤
  "#b0121b",  //  1  C#4        濃い赤
  "#ff8a3d",  //  2  D4  レ      オレンジ
  "#b3520c",  //  3  D#4        濃いオレンジ
  "#ffd60a",  //  4  E4  ミ      きいろ
  "#06d6a0",  //  5  F4  ファ    みどり
  "#047a5c",  //  6  F#4        濃いみどり
  "#3a86ff",  //  7  G4  ソ      青
  "#1b4fb8",  //  8  G#4        濃い青
  "#9b5de5",  //  9  A4  ラ      むらさき
  "#5f2fa8",  // 10  A#4        濃いむらさき
  "#ff80aa",  // 11  B4  シ      ピンク
  "#00b4d8",  // 12  C5  高いド  みずいろ
];
// 白鍵 8 本（音符インデックスと accessibility 用の名前）
const MUSIC_WHITE_NOTES = [
  { note: 0,  name: "ド"     },
  { note: 2,  name: "レ"     },
  { note: 4,  name: "ミ"     },
  { note: 5,  name: "ファ"   },
  { note: 7,  name: "ソ"     },
  { note: 9,  name: "ラ"     },
  { note: 11, name: "シ"     },
  { note: 12, name: "高いド" },
];
// 黒鍵 5 本。pos は境界位置（白鍵 1 本 = 1.0）
const MUSIC_BLACK_NOTES = [
  { note: 1,  pos: 1 },   // ド-レ間  C#4
  { note: 3,  pos: 2 },   // レ-ミ間  D#4
  { note: 6,  pos: 4 },   // ファ-ソ間 F#4
  { note: 8,  pos: 5 },   // ソ-ラ間  G#4
  { note: 10, pos: 6 },   // ラ-シ間  A#4
];
const musicKeys = [];           // {el, note, black}
let musicKeysBuilt = false;

function buildMusicKeys() {
  if (musicKeysBuilt) return;
  const host = document.getElementById("music-keys");
  if (!host) return;
  host.innerHTML = "";
  musicKeys.length = 0;
  // 白鍵（flex で等幅に並ぶ）
  for (const w of MUSIC_WHITE_NOTES) {
    const el = document.createElement("div");
    el.className = "music-key white";
    el.dataset.note = String(w.note);
    el.setAttribute("aria-label", w.name);
    el.style.setProperty("--tint", MUSIC_KEY_COLORS[w.note]);
    host.appendChild(el);
    musicKeys.push({ el, note: w.note, black: false });
  }
  // 黒鍵（白鍵の上に絶対配置で重ねる）
  for (const b of MUSIC_BLACK_NOTES) {
    const el = document.createElement("div");
    el.className = "music-key black";
    el.dataset.note = String(b.note);
    // CSS の left: calc(var(--pos) * 100% / 8) で境界位置に置かれる
    el.style.setProperty("--pos", String(b.pos));
    el.style.setProperty("--tint", MUSIC_KEY_COLORS[b.note]);
    host.appendChild(el);
    musicKeys.push({ el, note: b.note, black: true });
  }
  musicKeysBuilt = true;
}

function initMusic() {
  buildMusicKeys();
  particles.length = 0;
}

// 絶対座標 (x, y) → 押された鍵 {el, note, black}。どの鍵にも当たらなければ null。
// 黒鍵は白鍵の上に重なっているため、必ず黒鍵から判定する（黒鍵優先）。
function keyFromPoint(x, y) {
  // 黒鍵を優先（重なっている領域は黒鍵の音を鳴らす）
  for (const k of musicKeys) {
    if (!k.black) continue;
    const r = k.el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return k;
  }
  for (const k of musicKeys) {
    if (k.black) continue;
    const r = k.el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return k;
  }
  return null;
}

function setupMusicTap() {
  const host = document.getElementById("music-keys");
  if (!host) return;
  buildMusicKeys();

  // pointerId ごとに「いまどの鍵を押しているか」を覚えて、ドラッグで鍵またぎを検知
  const active = new Map();

  function playForKey(k) {
    SoundKit.playMusicNote(k.note, 0.6);
    k.el.classList.add("pressed");
    // 短いアニメ（押しっぱなしでも 180ms で解除＝連打で固まらない）
    setTimeout(() => k.el.classList.remove("pressed"), 180);
    // 鍵の位置（縦 60% のあたり）きらきら粒子
    const r = k.el.getBoundingClientRect();
    spawnParticles(r.left + r.width / 2, r.top + r.height * 0.6,
                   MUSIC_KEY_COLORS[k.note], 18);
  }

  function onDown(e) {
    e.preventDefault();
    if (isPalmTouch(e)) return;
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    const k = keyFromPoint(e.clientX, e.clientY);
    active.set(e.pointerId, k);
    if (k) playForKey(k);
  }
  function onMove(e) {
    if (!active.has(e.pointerId)) return;
    e.preventDefault();
    const k = keyFromPoint(e.clientX, e.clientY);
    const prev = active.get(e.pointerId);
    if (k !== prev) {
      active.set(e.pointerId, k);
      if (k) playForKey(k);
    }
  }
  function onUp(e) {
    if (e && e.pointerId != null) active.delete(e.pointerId);
    if (e && e.preventDefault) e.preventDefault();
  }

  host.addEventListener("pointerdown",   onDown, {passive:false});
  host.addEventListener("pointermove",   onMove, {passive:false});
  host.addEventListener("pointerup",     onUp,   {passive:false});
  host.addEventListener("pointercancel", onUp,   {passive:false});
  host.addEventListener("pointerleave",  onUp,   {passive:false});
  host.addEventListener("click", e => e.preventDefault());
}

/* =====================================================================
   モード：のりもの
   - 3 台の乗り物（🚗🚌🚃🚒🚓🚜 からランダム）、横長の道（空色＋緑の地面）。
   - タップで走行アニメーション＋擬音。走行中の再タップで走行リスタート可。
   ===================================================================== */
const VEHICLE_COUNT = 3;
// グローバル vehicles 配列は SoundKit.vehicles と被るので別名で持つ
const runningVehicles = [];     // {el, kind, runState, t0, dur, dir, fromX, toX, x}
let vehicleRunRaf = null;

function pickRandomVehicleKind() {
  return Math.floor(Math.random() * SoundKit.vehicles.length);
}

function buildVehicles() {
  const host = document.getElementById("vehicle-area");
  if (!host) return;
  host.innerHTML = "";
  runningVehicles.length = 0;
  const W0 = window.innerWidth;
  for (let i = 0; i < VEHICLE_COUNT; i++) {
    const el = document.createElement("div");
    el.className = "vehicle";
    const kind = pickRandomVehicleKind();
    el.textContent = SoundKit.vehicles[kind].emo;
    host.appendChild(el);
    runningVehicles.push({
      el, kind,
      runState: "idle",          // "idle" | "running" | "returning"
      t0: 0, dur: 1.2,
      dir: 1,                     // +1: 右へ、-1: 左へ
      fromX: 0, toX: 0,
      // 待機位置（左・中央・右）。layoutVehicles() で詳細を最終決定
      slotX: W0 * (i === 0 ? 0.25 : i === 1 ? 0.5 : 0.75),
      slotI: i,
      x:      W0 * (i === 0 ? 0.25 : i === 1 ? 0.5 : 0.75),
    });
  }
  layoutVehicles();
}

// 3 台を「画面内に完全に収まる」配置に並べる。
// 利用可能領域は上 H*0.38 〜 下 H*0.97（⏱/🏠 と重ならず、画面外にも出ない）。
// 1 台の高さ h = min(22vmin 相当, (領域高さ / 段数) * 0.98) で再計算し、
// font-size を各段に合わせる。横向きでは 3 台を左・中央・右に横並びでも OK。
// 全台で 0 <= top, bottom <= innerHeight が成立するよう、top を cellCenter - h/2 で配置。
function layoutVehicles() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const isLandscape = W >= H;
  const slotCount = runningVehicles.length;

  // 利用可能領域：上 H*0.38 〜 下 H*0.97
  const regionTop = H * 0.38;
  const regionBottom = H * 0.97;
  const regionHeight = regionBottom - regionTop;

  // font-size の基準値（22vmin = 短辺の 22%）
  const baseFontSize = Math.min(W, H) * 0.22;

  if (isLandscape) {
    // 横向き：3 台を「左・中央・右」に横 1 列で配置（同じ高さ）
    // 1 行の上限 = regionHeight * 0.92（行内に上下 4% ずつの余白）
    const cellSize = Math.min(baseFontSize, regionHeight * 0.92);
    const centerY = regionTop + regionHeight / 2;
    const slotXs = [W * 0.25, W * 0.5, W * 0.75];
    for (let i = 0; i < slotCount; i++) {
      const v = runningVehicles[i];
      v.slotX = slotXs[i];
      const topY = centerY - cellSize / 2;
      v.el.style.top = topY + "px";
      v.el.style.fontSize = cellSize + "px";
      if (v.runState === "idle") {
        v.x = v.slotX;
        // 向きを保持して pop を防ぐ（buildVehicles で dir=1 に初期化済み）
        v.el.style.transform = `translate(calc(-50% + ${v.x - W*0.5}px), 0) scaleX(${v.dir})`;
      }
      // running/returning 中の v.x は tick が補間中で触らない（戻り先の slotX だけ更新）
    }
  } else {
    // 縦向き：3 台を 3 段に縦並び（中央に配置）
    // 各段 = regionHeight / slotCount、その 0.97 倍を font-size 上限に
    const slotHeight = regionHeight / slotCount;
    const cellSize = Math.min(baseFontSize, slotHeight * 0.97);
    for (let i = 0; i < slotCount; i++) {
      const v = runningVehicles[i];
      v.slotX = W * 0.5;
      const cellCenterY = regionTop + slotHeight * (i + 0.5);
      const topY = cellCenterY - cellSize / 2;
      v.el.style.top = topY + "px";
      v.el.style.fontSize = cellSize + "px";
      if (v.runState === "idle") {
        v.x = v.slotX;
        // 向きを保持して pop を防ぐ（buildVehicles で dir=1 に初期化済み）
        v.el.style.transform = `translate(calc(-50% + ${v.x - W*0.5}px), 0) scaleX(${v.dir})`;
      }
      // running/returning 中の v.x は tick が補間中で触らない（戻り先の slotX だけ更新）
    }
  }
}

// 雲を 2〜3 個、空の上側（0%〜40%）に静的配置。resize でも崩れないように % で置く。
function buildClouds() {
  const stage = document.getElementById("stage-vehicle");
  if (!stage) return;
  // 既存の雲を除去（initVehicle 複数回呼び出し対応）
  stage.querySelectorAll(".cloud").forEach(c => c.remove());
  // 雲の絵文字サイズは短辺の 13% 程度
  const cloudSize = Math.min(window.innerWidth, window.innerHeight) * 0.13;
  const positions = [
    { l: 12, t:  6 },   // 左上
    { l: 68, t: 13 },   // 右上
    { l: 40, t:  8 },   // 中央上（雲は空の領域＝上から約 32% より上にだけ置く）
  ];
  for (const p of positions) {
    const el = document.createElement("div");
    el.className = "cloud";
    el.textContent = "☁️";
    el.style.left = p.l + "%";
    el.style.top  = p.t + "%";
    el.style.fontSize = cloudSize + "px";
    stage.appendChild(el);
  }
}

function startVehicleRun(v) {
  const W = window.innerWidth;
  // 画面外への距離で左右どちらへ走るか決める
  const distRight = W - v.x;
  const distLeft  = v.x;
  const goRight = distRight >= distLeft;
  v.dir = goRight ? 1 : -1;
  v.t0 = performance.now();
  v.dur = 1.0 + Math.random() * 0.4;
  v.runState = "running";
  v.fromX = v.x;
  v.toX = goRight ? (W + W * 0.2) : (-W * 0.2);
  // 絵文字反転（左向きへ走るときは左右反転）
  v.el.style.transform = `translate(calc(-50% + ${v.x - W*0.5}px), 0) scaleX(${v.dir})`;
}

function tickVehicleRuns(now) {
  const W = window.innerWidth;
  for (let i = 0; i < runningVehicles.length; i++) {
    const v = runningVehicles[i];
    if (v.runState === "running") {
      const t = (now - v.t0) / 1000;
      const u = Math.min(1, t / v.dur);
      // ease-in-out
      const e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
      v.x = v.fromX + (v.toX - v.fromX) * e;
      v.el.style.transform = `translate(calc(-50% + ${v.x - W*0.5}px), 0) scaleX(${v.dir})`;
      if (u >= 1) {
        // 反対側から「待機位置」へ戻るアニメーション。
        // この瞬間は画面外（dir>0 なら右端+W*0.2、dir<0 なら -W*0.2）にいるので、
        // ここで別の絵文字へ入れ替えれば見た目には切り替わらない。
        v.runState = "returning";
        v.t0 = now;
        v.dur = 1.6 + Math.random() * 0.6;
        if (v.dir > 0) {
          v.fromX = -W * 0.2;
          v.toX   = v.slotX;
        } else {
          v.fromX = W + W * 0.2;
          v.toX   = v.slotX;
        }
        // 画面外で見えないうちに絵文字だけ入れ替える（idle 時の pop を防ぐ）
        v.kind = pickRandomVehicleKind();
        v.el.textContent = SoundKit.vehicles[v.kind].emo;
      }
    } else if (v.runState === "returning") {
      const t = (now - v.t0) / 1000;
      const u = Math.min(1, t / v.dur);
      const e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
      v.x = v.fromX + (v.toX - v.fromX) * e;
      v.el.style.transform = `translate(calc(-50% + ${v.x - W*0.5}px), 0) scaleX(${v.dir})`;
      if (u >= 1) {
        // 絵文字の入れ替えは上記の running→returning 境界で行ったので、ここでは触らない。
        // scaleX も v.dir のままにして、idle 確定時に向きが反転する pop を防ぐ。
        v.runState = "idle";
      }
    }
  }
}

function loopVehicles() {
  function frame(now) {
    // モード離脱時: rAF を null に戻し、ホーム→再入場時に loopVehicles() を再起動させる
    if (currentMode !== "vehicle") {
      vehicleRunRaf = null;
      return;
    }
    tickVehicleRuns(now);
    vehicleRunRaf = requestAnimationFrame(frame);
  }
  vehicleRunRaf = requestAnimationFrame(frame);
}

function initVehicle() {
  buildVehicles();
  buildClouds();
  particles.length = 0;
  // 既存の rAF を必ずキャンセルしてから常にループ開始（2 回目以降の入場でもアニメが走る）
  if (vehicleRunRaf != null) {
    cancelAnimationFrame(vehicleRunRaf);
    vehicleRunRaf = null;
  }
  loopVehicles();
}

function setupVehicleTap() {
  const host = document.getElementById("vehicle-area");
  if (!host) return;
  buildVehicles();
  bindResize(layoutVehicles);

  function onDown(e) {
    e.preventDefault();
    if (isPalmTouch(e)) return;
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    // タップされた DOM が vehicle か判定（祖先方向にたどる）
    let node = e.target;
    while (node && node !== host) {
      if (node.classList && node.classList.contains("vehicle")) {
        const idx = runningVehicles.findIndex(v => v.el === node);
        if (idx >= 0) {
          const v = runningVehicles[idx];
          // 走行中でも走行中でも、音は鳴らして走行はリスタート
          SoundKit.playVehicleSound(v.kind);
          startVehicleRun(v);
        }
        return;
      }
      node = node.parentNode;
    }
    // どの vehicle でもない場所をタップ:
    // #vehicle-area は pointer-events:none なのでここに到達することはない (死に分岐)。
    // 以前はここで SoundKit.playTwinkle() を呼んでいたが、常に未達だったので削除した。
  }
  host.addEventListener("pointerdown", onDown, {passive:false});
  host.addEventListener("click", e => e.preventDefault());
}

/* =====================================================================
   モード：おえかき
   - クリーム色のキャンバスに指でなぞると太い線が描ける。描いた線は画面に残る。
   - ストローク（1 回なぞり）ごとに自動で色が変わる（赤→橙→黄→緑→青→紫→ピンク）。
     子供に色を選ばせない／考えさせない方針。
   - マルチタッチ対応（pointerId ごとに現在のストロークを管理）。
     掌は無視、pointercancel/pointerup で終了。isPalmTouch は通常のタップ扱い。
   - リサイズ・回転に耐えるため、ストロークは正規化座標（0〜1）で保持し、
     毎フレームの全ストローク再描画と move 時の差分描画を併用する。
   - HiDPI（devicePixelRatio）対応は setupModeCanvas に任せる。
   - 先端には小さなきらきら粒子、ストローク開始時に色に対応する短い音を 1 回だけ鳴らす。
   - 「けす」ボタン（🧽）で全部消える。短いタップで OK（誤操作しても困らない遊び）。
   ===================================================================== */
// ストロークごとに自動で選ぶ色（赤橙黄緑青紫ピンク、順に巡回）。
// 濃すぎず明るい色。子供になじみのある 7 色。
const DRAW_COLORS = [
  "#ff5a5f",  // 赤
  "#ff8a3d",  // 橙
  "#ffd60a",  // 黄
  "#06d6a0",  // 緑
  "#3a86ff",  // 青
  "#9b5de5",  // 紫
  "#ff80aa",  // ピンク
];
// 色ごとに鳴らす音の高さ（C5 メジャースケール相当、やわらかい高音）。
const DRAW_FREQS = [523.25, 587.33, 659.26, 698.46, 783.99, 880.00, 987.77];
// ストロークと描画済み（正規化座標）の蓄積。永続的なので長時間は膨らむが、
// 子供が描く量なら高々数百〜数千ポイントで収まる（毎フレーム再描画しても軽い）。
const drawStrokes = [];   // {points:[{nx,ny}], color, width}
let drawColorIndex = 0;   // 次のストロークで使う色のインデックス

function pickNextDrawColor() {
  const i = drawColorIndex % DRAW_COLORS.length;
  drawColorIndex++;
  return { color: DRAW_COLORS[i], freq: DRAW_FREQS[i] };
}

function initDraw() {
  drawStrokes.length = 0;
  drawColorIndex = 0;
  particles.length = 0;
  const cv = document.getElementById("draw-canvas");
  const onResize = setupModeCanvas(cv);
  bindResize(onResize);
  loopDraw(cv);
}

// ストロークを canvas に描画する共通処理（points を正規化座標として渡す）
function drawStroke(ctx2d, w, h, stroke) {
  const pts = stroke.points;
  if (!pts || pts.length === 0) return;
  ctx2d.save();
  ctx2d.strokeStyle = stroke.color;
  ctx2d.fillStyle   = stroke.color;
  ctx2d.lineWidth   = stroke.width;
  ctx2d.lineCap     = "round";
  ctx2d.lineJoin    = "round";
  // 1 本の線
  if (pts.length >= 2) {
    ctx2d.beginPath();
    ctx2d.moveTo(pts[0].nx * w, pts[0].ny * h);
    for (let i = 1; i < pts.length; i++) {
      ctx2d.lineTo(pts[i].nx * w, pts[i].ny * h);
    }
    ctx2d.stroke();
  }
  // 単一点（タップだけ）のときも丸い点が見えるよう、lineCap="round" 効果と
  // は別に fill で重ねる（短辺 2.4% を直径とする丸）
  if (pts.length === 1) {
    ctx2d.beginPath();
    ctx2d.arc(pts[0].nx * w, pts[0].ny * h, stroke.width / 2, 0, Math.PI * 2);
    ctx2d.fill();
  }
  // 先端の強調（点も線も、見た目が一目で「ここに指がある」と分かるよう少し濃い丸を重ねる）
  const last = pts[pts.length - 1];
  ctx2d.beginPath();
  ctx2d.arc(last.nx * w, last.ny * h, stroke.width * 0.55, 0, Math.PI * 2);
  ctx2d.fill();
  ctx2d.restore();
}

function loopDraw(cv) {
  const ctx2d = cv.getContext("2d");
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const w = cv.clientWidth, h = cv.clientHeight;

    // 背景の透明部分を stage の #fffaf0 に任せるため、ここではクリアだけ
    ctx2d.clearRect(0, 0, w, h);

    // 既存のストロークを順次描画（リサイズ・回転に対応）
    for (const s of drawStrokes) {
      drawStroke(ctx2d, w, h, s);
    }
    // きらきら粒子
    updateParticles(dt);
    drawParticles(ctx2d);

    // モード離脱時はループ停止（再入場で initDraw が loopDraw を起こす）
    if (currentMode === "draw") requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function setupDrawTap() {
  const cv = document.getElementById("draw-canvas");
  if (!cv) return;
  // pointerId ごとに「いま描いているストローク」を覚えてマルチタッチに対応
  const pointers = new Map();

  function getXY(e) {
    // touches / pointer のいずれかから座標を取る（既存モードと同じ慣習）
    if (e.touches && e.touches[0]) return {x: e.touches[0].clientX, y: e.touches[0].clientY};
    return {x: e.clientX, y: e.clientY};
  }

  function onDown(e) {
    e.preventDefault();
    // 掌相当の接触は無視（他モードと同じ）
    if (isPalmTouch(e)) return;
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    const {x, y} = getXY(e);
    const r = cv.getBoundingClientRect();
    const lx = x - r.left, ly = y - r.top;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (w <= 0 || h <= 0) return;
    const { color, freq } = pickNextDrawColor();
    // 線幅：画面短辺の 2.4%、最小 10px
    const base = Math.min(window.innerWidth, window.innerHeight);
    const lineW = Math.max(10, base * 0.024);
    const stroke = {
      points: [{ nx: Math.max(0, Math.min(1, lx / w)),
                 ny: Math.max(0, Math.min(1, ly / h)) }],
      color, width: lineW,
    };
    pointers.set(e.pointerId, stroke);
    drawStrokes.push(stroke);
    // ストローク開始時の音を 1 回だけ鳴らす（playNote が内部で acquireVoice して上限管理）
    SoundKit.playNote(freq, 0.22, 0.16);
    // 描き始めの先端に少量きらきら
    spawnParticles(lx, ly, color, 8);
  }

  function onMove(e) {
    const stroke = pointers.get(e.pointerId);
    if (!stroke) return;
    e.preventDefault();
    const {x, y} = getXY(e);
    const r = cv.getBoundingClientRect();
    const lx = x - r.left, ly = y - r.top;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (w <= 0 || h <= 0) return;
    const nx = Math.max(0, Math.min(1, lx / w));
    const ny = Math.max(0, Math.min(1, ly / h));
    const prev = stroke.points[stroke.points.length - 1];
    // 同一座標を間引いて、無駄な点を増やさない（指の細かい揺れで線が黒く
    // つぶれるのを防ぐ）。閾値は線幅の半分より少し小さめ。
    if (prev && Math.hypot((nx - prev.nx) * w, (ny - prev.ny) * h) < stroke.width * 0.4) {
      return;
    }
    stroke.points.push({ nx, ny });
    // move 時は「増えた末尾だけ」を描画（毎フレームの全ストローク再描画より軽量）
    const ctx2d = cv.getContext("2d");
    ctx2d.save();
    ctx2d.strokeStyle = stroke.color;
    ctx2d.lineWidth   = stroke.width;
    ctx2d.lineCap     = "round";
    ctx2d.lineJoin    = "round";
    ctx2d.beginPath();
    ctx2d.moveTo(prev.nx * w, prev.ny * h);
    ctx2d.lineTo(nx * w, ny * h);
    ctx2d.stroke();
    // 先端の濃い丸（描画の「今」感を残す）
    ctx2d.beginPath();
    ctx2d.arc(nx * w, ny * h, stroke.width * 0.55, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.restore();
  }

  function onUp(e) {
    if (e && e.pointerId != null) pointers.delete(e.pointerId);
    if (e && e.preventDefault) e.preventDefault();
  }

  cv.addEventListener("pointerdown",   onDown, {passive:false});
  cv.addEventListener("pointermove",   onMove, {passive:false});
  cv.addEventListener("pointerup",     onUp,   {passive:false});
  cv.addEventListener("pointercancel", onUp,   {passive:false});
  // pointerleave は iOS 保険（家の終了時に map をクリア）
  cv.addEventListener("pointerleave",  onUp,   {passive:false});
  cv.addEventListener("click",         e => e.preventDefault());

  // 「けす」ボタン：タップで描画を全部クリア（短いタップで OK）
  const clearBtn = document.getElementById("draw-clear-btn");
  if (clearBtn) {
    clearBtn.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      if (isPalmTouch(ev)) return;
      // 音/全画面の準備で例外が出ても、クリア処理は必ず走るよう try/catch で囲う
      try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
      try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
      drawStrokes.length = 0;
      particles.length = 0;
      // クリア時の軽いフィードバック音（他モードの playTwinkle と同系のきらきら音）
      SoundKit.playTwinkle();
    });
    // pointerup を抑止して意図しない二重発火や隣のタップを巻き込まない
    clearBtn.addEventListener("pointerup",     ev => ev.preventDefault());
    clearBtn.addEventListener("pointercancel", ev => ev.preventDefault());
    clearBtn.addEventListener("click",         ev => ev.preventDefault());
  }
}

/* =====================================================================
   ホーム：カードでモード切替
   ===================================================================== */
function setupHomeCards() {
  document.querySelectorAll(".home-card").forEach(card => {
    card.addEventListener("click", e => {
      e.preventDefault();
      // 音/全画面の準備で例外が出ても、モード切替は必ず走るよう try/catch で囲う
      try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
      try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
      showMode(card.dataset.mode);
    });
    // 絵文字だけ表示（対象児が読める文字なし）
    const map = { animal:"🐶", balloon:"🎈", color:"🎨", music:"🎹", vehicle:"🚗", draw:"🖍️" };
    card.textContent = map[card.dataset.mode] || "•";
  });
}

/* =====================================================================
   起動
   ===================================================================== */
let playTimerLoopInterval = null;
function playTimerTickInterval() {
  const now = performance.now();
  if (playTimer.finished) return;             // 二重防止
  if (playTimer.limitMs <= 0) return;         // 設定なし
  if (!playTimer.inMode) return;              // ホーム・おしまいは数えない
  if (playTimer.pausedAtMs != null) return;   // 非表示中
  if (currentElapsedMs(now) >= playTimer.limitMs) {
    triggerFinish(now);
  }
}

function start() {
  TimerConfig.init();
  playTimer.limitMs = TimerConfig.getLimitMs();
  setupHomeButtons();
  setupTimerButton();
  setupHomeCards();
  setupAnimalTap();
  setupBalloonTap();
  setupColorTap();
  setupMusicTap();
  setupVehicleTap();
  setupDrawTap();
  setupFinishStage();
  // タブが裏に行ったときは時間計測を止める
  document.addEventListener("visibilitychange", () => {
    const now = performance.now();
    if (document.visibilityState === "hidden") {
      onVisibilityHidden(now);
    } else {
      onVisibilityVisible(now);
      // iOS は裏→表で AudioContext が "interrupted" に戻ることがあるので resume を試みる
      try { SoundKit.tryResume(); } catch (_) { /* ignore */ }
    }
  });
  // タイマー監視（500ms ごとにチェック、軽量）
  if (playTimerLoopInterval == null) {
    playTimerLoopInterval = setInterval(playTimerTickInterval, 500);
  }
  // ホームに居続ける
  showMode("home");
}
start();

/* =====================================================================
   念のためのエラーハンドリング
   ===================================================================== */
window.addEventListener("error", ev => {
  console.warn("[baby-tap] runtime error:", ev.message);
});
window.addEventListener("unhandledrejection", ev => {
  console.warn("[baby-tap] unhandled rejection:", ev.reason);
});
</script>
