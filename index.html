<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぽんぽん">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ぽんぽんあそび</title>
<style>
  /* ===== レイアウト共通 ===== */
  :root {
    --h-pad: env(safe-area-inset-top, 0px);
    --b-pad: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  body { position: fixed; inset: 0; }

  /* ステージ：モード切替で表示/非表示 */
  .stage {
    position: absolute; inset: 0;
    display: none;
    overflow: hidden;
  }
  .stage.active { display: block; }

  /* ===== ホーム ===== */
  #stage-home {
    background: linear-gradient(180deg, #ffd6e8 0%, #c1f0ff 100%);
  }
  #stage-home .wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;          /* 行内のカード縦中央 */
    align-content: center;        /* 複数行をコンテナ中央に寄せる（縦向きの大空白解消） */
    gap: 3vmin;
    /* ⏱(右上, height≒11vmin+top24) と 🏠(左上, 同上) の下にカード 1 行目が
       食い込まないよう、ホームのカード領域に上下 200/60px の非対称な固定余白を確保する。
       実測 (1376x1032 横向き) で timer-status の箱が y=150〜186、右上カードが y=170 からで
       16px 重なっていたため padding-top を 200px に。
       padding-bottom は 60px に縮めて画面を有効に使う（上下合計 260px）。
       safe-area がそれを超える端末（現状は iOS が最大でも ~50px）は
       max() で常にそれぞれの固定値を下限にする。中央寄せは align-content:center で成立。 */
    padding-top:    max(200px, env(safe-area-inset-top, 0px));
    padding-bottom: max(60px,  env(safe-area-inset-bottom, 0px));
    padding-left:   4vw;
    padding-right:  4vw;
    /* カード 1 辺を CSS 変数で公開。絵文字サイズ (card * 0.55) の基準にも使う。
       - 上限 40vmin (カードが際限なく大きくならないように)
       - 横方向制約: 3 枚 + gap 2 つ ≤ 100vw
       - 縦方向制約: 2 枚 + gap 1 つ ≤ (100vh - 上下余白合計 260px)
       → 上下の固定余白が 200px / 60px なので、合計 260px で計算する。 */
    --card: min(40vmin, calc((100vw - 6vmin) / 3), calc((100vh - 260px - 3vmin) / 2));
  }
  .home-card {
    /* カード 1 辺は .wrap の --card (25〜30vmin 相当)。
       絵文字はカード 1 辺の 55% (font-size: calc(var(--card) * 0.55))。 */
    width: var(--card);
    /* max-width 220px は廃止 (iPad では小さく見える)。上限は 40vmin のキャップで十分。 */
    min-width: 72px;
    aspect-ratio: 1 / 1;
    border: 0;
    border-radius: 28px;
    background: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--card) * 0.55);
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: transform .12s ease;
  }
  .home-card:active { transform: scale(.96); }

  /* ===== 共通ヘッダー（🏠ボタン） ===== */
  .home-btn {
    position: absolute;
    top: max(24px, env(safe-area-inset-top, 0px));
    left: max(24px, env(safe-area-inset-left, 0px));
    width: clamp(72px, 11vmin, 120px);
    height: clamp(72px, 11vmin, 120px);
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    border: 0;
    font-size: clamp(28px, 5vmin, 48px);
    line-height: 1;
    text-align: center;
    z-index: 30;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-btn canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;     /* 進捗リングは描画のみ */
  }
  .home-btn.locked { background: rgba(255,200,200,.95); }

  /* 🏠長押し判定中：他要素のタップを抑止（誤操作対策）
     ⏱(.timer-btn)も除外：短いクリックで ⏱ に pointer-events:none が当たり、
     pointerup がボタンに届かず cancelHold が呼ばれない問題を避けるため */
  body.home-locking .stage > *:not(.home-btn):not(.timer-btn) { pointer-events: none; }

  /* ===== モード共通キャンバス ===== */
  .mode-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 5;
    touch-action: none;
  }

  /* ===== どうぶつ ===== */
  #stage-animal {
    background: linear-gradient(180deg, #fff7d6 0%, #ffe7c1 100%);
  }
  #animal-stage {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 10;
    will-change: transform;
  }
  #animal-emoji {
    font-size: 60vmin;   /* 短辺の 6 割相当 */
    line-height: 1;
    transform-origin: center center;
    will-change: transform;
    pointer-events: auto;
    touch-action: none;
  }

  /* ===== ふうせん ===== */
  #stage-balloon {
    background: linear-gradient(180deg, #bde0fe 0%, #a2d2ff 100%);
  }

  /* ===== いろ ===== */
  #stage-color {
    background: #0b1020;
  }

  /* ===== おとあそび（鍵盤） ===== */
  #stage-music {
    background: linear-gradient(180deg, #e8ddff 0%, #d4d4ff 100%);
  }
  /* 鍵盤は画面中央に大きく。上下は 14% を確保しつつ、高さは 62vmin で頭打ちにして
     縦長画面（834x1194 など）で鍵が異様に間延びしないようにする。
     top/bottom 指定 + margin:auto で縦横中央寄せになる。
     白鍵 1 本の比率は 0.15（縦向き）〜0.27（横向き）で、実物のピアノ（約 0.15）に近い。 */
  #music-keys {
    position: absolute;
    left: 3vw;
    right: 3vw;
    top: 14%;
    bottom: 14%;
    max-height: 62vmin;
    margin: auto;                    /* 上下中央寄せ */
    display: flex;
    gap: 2px;                        /* 白鍵の細い境目線 */
  }
  /* 赤いフェルト帯（鍵盤上端）。タップは邪魔しない */
  #music-keys::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 2vmin;
    background: linear-gradient(180deg, #a52424 0%, #8b1a1a 55%, #6d1313 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
    border-radius: 6px;
    z-index: 3;
    pointer-events: none;
  }
  .music-key {
    position: relative;
    border: 0;
    padding: 0;
    pointer-events: auto;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
    transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
  }
  /* 押した鍵のレインボー色（JS が --tint に設定）を乗せる層。
     opacity 0→.55 で点灯し、class を外すと 180ms で戻る */
  .music-key::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--tint, #fff);
    opacity: 0;
    transition: opacity 180ms ease;
    pointer-events: none;
  }
  /* 押下中は遷移時間を 0 にし「即沈み・即点灯」、戻すときだけ 180ms で復活させる */
  .music-key.pressed { transition-duration: 0ms; }
  .music-key.pressed::after { transition-duration: 0ms; }

  /* 白鍵: 8 本を隙間なく等幅で並べる */
  .music-key.white {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 0 0 14px 14px;
    background: linear-gradient(180deg, #ffffff 0%, #fafafe 68%, #e4e4ee 100%);
    box-shadow:
      inset 1px 0 0 rgba(0,0,0,.14),      /* 左の境目線 */
      inset -1px 0 0 rgba(0,0,0,.14),     /* 右の境目線 */
      0 6px 0 rgba(0,0,0,.16),           /* 下端の厚み */
      0 10px 14px rgba(0,0,0,.20);       /* 影 */
    z-index: 1;
  }
  .music-key.white.pressed {
    transform: translateY(3px);
    box-shadow:
      inset 1px 0 0 rgba(0,0,0,.14),
      inset -1px 0 0 rgba(0,0,0,.14),
      0 2px 0 rgba(0,0,0,.20),
      0 4px 8px rgba(0,0,0,.18);
    filter: saturate(1.15) brightness(1.02);
  }
  .music-key.white.pressed::after { opacity: .55; }

  /* 黒鍵: 白鍵の上に重ねる。--pos は境界位置 / 8（JS が設定） */
  .music-key.black {
    position: absolute;
    top: 0;
    left: calc(var(--pos, 0) * 100% / 8);
    width: 7.5%;                      /* 白鍵 1 本 (12.5%) の 60% */
    height: 62%;                      /* 鍵盤全体-height の 62% */
    border-radius: 0 0 8px 8px;
    background: linear-gradient(180deg, #4c4c55 0%, #26262c 46%, #131316 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),   /* 上の光沢 */
      0 4px 0 rgba(0,0,0,.55),
      0 7px 10px rgba(0,0,0,.45);
    transform: translateX(-50%);
    z-index: 2;
  }
  .music-key.black.pressed {
    transform: translate(-50%, 3px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.25),
      0 1px 0 rgba(0,0,0,.60),
      0 3px 6px rgba(0,0,0,.40);
    filter: brightness(1.25);
  }
  .music-key.black.pressed::after { opacity: .60; }

  /* ===== おえかき ===== */
  #stage-draw {
    /* 白に近いクリーム色。指でなぞると太い線が描ける */
    background: #fffaf0;
  }
  /* 「けす」ボタン（画面右下の大きな丸）。.home-btn と同じ見た目・サイズ。
     z-index は canvas (.mode-canvas の 5) より大きく、描画と干渉しない */
  #draw-clear-btn {
    position: absolute;
    right: max(24px, env(safe-area-inset-right, 0px));
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    width: clamp(72px, 11vmin, 120px);
    height: clamp(72px, 11vmin, 120px);
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    border: 0;
    font-size: clamp(28px, 5vmin, 48px);
    line-height: 1;
    text-align: center;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease;
  }
  #draw-clear-btn:active { transform: scale(.96); }

  /* ===== のりもの ===== */
  #stage-vehicle {
    /* 地平線（空↔地面の境界）は上から 32%。layoutVehicles が乗り物を置く
       領域（top = H*0.38 〜 bottom = H*0.97）は全て地面側の範囲になり、
       絵文字のすぐ下にある .vehicle::after の影が地面に接地して見える。 */
    background: linear-gradient(180deg, #a8def9 0%, #c5e8f7 32%, #7cb342 32%, #558b2f 100%);
  }
  #vehicle-area {
    position: absolute;
    inset: 0;
    pointer-events: none;       /* 乗っていない領域は親に流さない */
  }
  .vehicle {
    position: absolute;
    left: 50%;
    top: 0;
    /* 絵文字を中央配置するため translate(-50%, 0) を transform 側で組み合わせる前提 */
    font-size: 22vmin;   /* 30 → 22: 3 台が地面幅に並び、重ならないサイズ */
    line-height: 1;
    pointer-events: auto;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
    will-change: transform;
    transform-origin: center center;
  }
  /* 足元の影：薄い楕円（半透明の黒・絵文字の幅 70%・高さ 0.18em）で地面に接地して見える。
     親 .vehicle は JS から transform（走行中の translate + scaleX 反転）を毎フレーム更新されるが、
     ::after は同じ親の中、絵文字の直下（top:100%）に張り付いているので、走行中も影が一緒に移動する。
     scaleX 反転は楕円なので見た目は変わらない（左右対称の楕円のまま）。
     pointer-events:none で影のうえでクリック判定が暴れないようにする。 */
  .vehicle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 85%;            /* 車輪の接地位置（絵文字の箱の約 93%）に影の中心が重なるようにする */
    width: 0.78em;
    height: 0.17em;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: -1;
  }
  /* 雲：のりもの画面の空に浮かべる背景装飾（タップ反応なし） */
  .cloud {
    position: absolute;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    line-height: 1;
    z-index: 1;            /* .vehicle (top) より奥、見えたらよい */
  }

  /* ===== タイマー設定（親用：ホーム右上の小さな⏱） ===== */
  .timer-btn {
    position: absolute;
    top: max(24px, env(safe-area-inset-top, 0px));
    right: max(24px, env(safe-area-inset-right, 0px));
    width: clamp(72px, 11vmin, 120px);
    height: clamp(72px, 11vmin, 120px);
    border-radius: 50%;
    background: rgba(255,255,255,.45);          /* 半透明で目立たせない */
    border: 0;
    font-size: clamp(28px, 5vmin, 48px);
    line-height: 1;
    text-align: center;
    z-index: 30;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .timer-btn canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;                      /* 進捗リングは描画のみ */
  }
  .timer-btn.locked { background: rgba(255,200,200,.75); }
  .timer-status {
    position: absolute;
    /* 🏠/⏱ ボタン直下に配置（ボタン 11vmin + 余白 12px + safe-area） */
    top: calc(max(24px, env(safe-area-inset-top, 0px)) + clamp(72px, 11vmin, 120px) + 12px);
    right: max(24px, env(safe-area-inset-right, 0px));
    width: clamp(68px, 12vmin, 120px);
    text-align: center;
    font-size: clamp(13px, 2.2vmin, 22px);
    font-weight: 700;
    color: rgba(80, 50, 90, 0.75);
    letter-spacing: 0.5px;
    z-index: 30;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== おしまい画面 ===== */
  #stage-finish {
    background: radial-gradient(ellipse at 50% 35%, #2a2a55 0%, #14142b 70%, #06061a 100%);
  }
  #stage-finish > *:not(.home-btn) { pointer-events: none; }   /* 子のタップには反応しない */
  .finish-moon {
    position: absolute;
    left: 50%; top: 48%;
    transform: translate(-50%, -50%);
    font-size: 32vmin;
    line-height: 1;
    opacity: 0.95;
    user-select: none;
  }
  .finish-stars {
    position: absolute; inset: 0;
  }
  .finish-stars span {
    position: absolute;
    color: #fff8c2;
    opacity: 0.85;
    font-size: clamp(14px, 2.8vmin, 24px);
    line-height: 1;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== フェード（おしまいの遷移用） ===== */
  /* フェードインを効かせるには transition を常時付けておく（fading を外した瞬間に 1s で戻る） */
  body { transition: opacity 1s ease; }
  body.fading {
    opacity: 0;
    pointer-events: none;                      /* フェード中はタップ抑止 */
  }
</style>
</head>
<body>

<!-- ========= ホーム ========= -->
<section id="stage-home" class="stage active">
  <button id="timer-btn" class="timer-btn" aria-label="タイマー設定"><canvas></canvas>⏱</button>
  <div id="timer-status" class="timer-status"></div>
  <div class="wrap">
    <button class="home-card" data-mode="animal" aria-label="どうぶつ"></button>
    <button class="home-card" data-mode="balloon" aria-label="ふうせん"></button>
    <button class="home-card" data-mode="color" aria-label="いろ"></button>
    <button class="home-card" data-mode="music" aria-label="おとあそび"></button>
    <button class="home-card" data-mode="vehicle" aria-label="のりもの"></button>
    <button class="home-card" data-mode="draw" aria-label="おえかき"></button>
  </div>
</section>

<!-- ========= どうぶつ ========= -->
<section id="stage-animal" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <div id="animal-stage">
    <div id="animal-emoji"></div>
  </div>
  <canvas class="mode-canvas" id="animal-canvas"></canvas>
</section>

<!-- ========= ふうせん ========= -->
<section id="stage-balloon" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <canvas class="mode-canvas" id="balloon-canvas"></canvas>
</section>

<!-- ========= いろ ========= -->
<section id="stage-color" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <canvas class="mode-canvas" id="color-canvas"></canvas>
</section>

<!-- ========= おとあそび ========= -->
<section id="stage-music" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <div id="music-keys"></div>
</section>

<!-- ========= のりもの ========= -->
<section id="stage-vehicle" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <div id="vehicle-area"></div>
</section>

<!-- ========= おえかき ========= -->
<section id="stage-draw" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <canvas class="mode-canvas" id="draw-canvas"></canvas>
  <button id="draw-clear-btn" aria-label="けす">🧽</button>
</section>

<!-- ========= おしまい ========= -->
<section id="stage-finish" class="stage">
  <button class="home-btn" aria-label="ホームへ"><canvas></canvas>🏠</button>
  <div class="finish-stars" id="finish-stars"></div>
  <div class="finish-moon">🌙</div>
</section>

<script>
"use strict";

/* =====================================================================
   baby-tap : 1歳8か月向けタップ知育ゲーム
   - 外部ライブラリ/画像/通信なし、絵は絵文字+Canvas
   - WebAudioで効果音合成のみ（読み上げは廃止：人工音声が棒読みになるため）
   - ピンチ/ダブルタップ/コンテキストメニュー/スクロール抑止
   ===================================================================== */

/* ---- 抑止：拡大・コンテキストメニュー・選択など ---- */
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), {passive:false})
);
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick",     e => e.preventDefault());
document.addEventListener("selectstart",  e => e.preventDefault());
document.addEventListener("dragstart",    e => e.preventDefault());
window.addEventListener("touchmove", e => {
  // 1本指のときも 2 本指のときも既定動作を抑止
  if (e.touches && e.touches.length >= 1) e.preventDefault();
}, {passive:false});

/* =====================================================================
   音声レイヤ (WebAudio のみ。読み上げ(speechSynthesis)は廃止)
   ===================================================================== */
const SoundKit = (() => {
  let ctx = null;
  let master = null;
  // 同時発音数の上限。超えたら新しい発音を捨てる（古い方を奪わない）。
  let voiceCount = 0;
  const MAX_VOICES = 8;

  function ensure() {
    if (ctx) return ctx;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      ctx = new Ctor();
      master = ctx.createGain();
      master.gain.value = 0.22;   // gain 0.25 以下、乳幼児配慮
      master.connect(ctx.destination);
    } catch (err) {

      ctx = null;
    }
    return ctx;
  }

  function tryResume() {

      ctx.resume().catch(err => console.warn("[audio] resume failed:", err));
    }
  }

  // 鳴らせなかった場合も他の処理（描画・反応）は止めない。
  function ensureRunning() {
    if (!ctx) return;
    if (ctx.state === "running") return;
    try { tryResume(); } catch (err) { console.warn("[audio] ensureRunning failed:", err); }
  }
  function unlock() {
    ensure();
    tryResume();
    loadAnimalSamples();   // 初回のみ（animalLoading で多重実行を防ぐ）
    // iOS: ユーザー操作の同期処理内で無音バッファを start(0) してアンロックする。
    // ctx.resume() は非同期なので最初のタップ時点では state がまだ "running" でないことが多い。
    // state を待たずに同期的に start() を呼べば、start は resume 完了後にキューから再生される。
    //
    // 「試行済み」フラグは使わない。判定は ctx.state === "running" のみで行い、

    // フラグで 1 回きりにしてしまうと、iOS Safari は pointerdown 内では resume が効かず、
    // 一度失敗すると二度と音が出なかった（実機 iPad で全タップ無音）。
    if (ctx && ctx.state !== "running") {
      try {
        const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * 0.1)), ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        // start が失敗してもフラグは立たない → 次の pointerup / touchend / click で再試行される
      } catch (err) { /* ignore */ }
    }
    // 読み上げ廃止：以前はここで primeTTS() を呼んでいた（iOS の無音対策）。
    // 人工音声が棒読みになるため speechSynthesis は今後一切使わない。
  }
  // 同時発音の管理。true で発音可、false でスキップ。
  function acquireVoice(durMs) {
    if (voiceCount >= MAX_VOICES) return false;
    voiceCount++;
    if (durMs > 0) setTimeout(releaseVoice, durMs);
    return true;
  }
  function releaseVoice() { voiceCount = Math.max(0, voiceCount - 1); }

  /* --------------- ユーティリティ --------------- */
  function envOsc(o, t0, dur, peak, attack, release) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0001), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + release + 0.02);
  }

  /* --------------- 鳴き声ユーティリティ --------------- */
  // ±pct% のランダムジッタ。鳴き声に毎回少し違う揺れを与える。
  // フォルマントを並列に重ねたあとの音量補正（聞こえ方は実測で調整）
  const FORMANT_MAKEUP = 6;
  const jit = (base, pct = 0.07) => base * (1 + (Math.random() * 2 - 1) * pct);
  // 短いノイズバースト（子音・息）。gain で包んで start/stop。rise は 5ms で短く。
  function noiseBurst(t0, dur, peak, freq) {
    const durSec = Math.max(0.01, dur);
    const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * durSec)), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      // 末尾で減衰するホワイトノイズ（破裂っぽさ）
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = freq || 2200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + durSec);
    src.connect(lp).connect(g).connect(master);
    src.start(t0);
    src.stop(t0 + durSec + 0.02);
  }

  /* --------------- 鳴き声 --------------- */
  // いぬ：ワンッ ワンッ 2 発: sawtooth 急降下（520→300Hz）+ ア母音のフォルマント
  function bark() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [0, 0.18].forEach((off, idx) => {
      const t0 = now + off;
      const dur = jit(0.14, 0.06);
      const f0 = jit(520, 0.06);
      const f1 = jit(300, 0.06);
      // 声帯（sawtooth, 急降下）
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(80, f1), t0 + dur * 0.7);
      // ア母音のフォルマント（F1=800, F2=1200 を bandpass で共鳴させる）
      const fA1 = ctx.createBiquadFilter();
      fA1.type = "bandpass"; fA1.frequency.value = 800;  fA1.Q.value = 3.5;
      const fA2 = ctx.createBiquadFilter();
      fA2.type = "bandpass"; fA2.frequency.value = 1200; fA2.Q.value = 3.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.20, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      // 母音の共鳴（フォルマント）は並列に重ねる（直列だと通る音がほぼ無くなる）
      const mix1 = ctx.createGain(); mix1.gain.value = FORMANT_MAKEUP;
      o.connect(fA1).connect(mix1); o.connect(fA2).connect(mix1);
      mix1.connect(g);
      g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
      // 立ち上がりにノイズ（ワンの子音・息）: 1 発目だけ
      if (idx === 0) noiseBurst(t0, 0.04, 0.10);
    });

  // ねこ：ニャーオ 0.9s, sawtooth ポルタメント（480→900→550Hz）+ イ→ア のフォルマント変化 + 軽いビブラート
  function meow() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const t0 = now;
    const dur = jit(0.9, 0.06);
    // 声帯（sawtooth）：にゃーの 3 段階ピッチ

    o.type = "sawtooth";
    o.frequency.setValueAtTime(jit(480, 0.05), t0);
    o.frequency.exponentialRampToValueAtTime(jit(900, 0.05), t0 + dur * 0.20);
    o.frequency.exponentialRampToValueAtTime(jit(550, 0.05), t0 + dur * 0.62);

    lfoFg.gain.value = 18;
    lfoF.connect(lfoFg).connect(o.frequency);
    // フォルマント「イ」(F1=300 F2=2200) → 「ア」(F1=800 F2=1200) へ口の形が変わる
    const f1 = ctx.createBiquadFilter();
    f1.type = "bandpass"; f1.Q.value = 3.5;

    f1.frequency.exponentialRampToValueAtTime(800, t0 + dur * 0.55);

    f2.type = "bandpass"; f2.Q.value = 3.5;

    f2.frequency.exponentialRampToValueAtTime(1200, t0 + dur * 0.55);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    // 母音の共鳴（フォルマント）は並列に重ねる（直列だと通る音がほぼ無くなる）
    const mix2 = ctx.createGain(); mix2.gain.value = FORMANT_MAKEUP;
    o.connect(f1).connect(mix2); o.connect(f2).connect(mix2);
    mix2.connect(g);
    g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
    lfoF.start(t0); lfoF.stop(t0 + dur + 0.02);
  }
  // うし：モォ〜 1.1s, sawtooth（150→115Hz）+ オ→ウ のフォルマント + ゆっくりビブラート + 鼻にかかった感じ
  function moo() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const t0 = now;
    const dur = jit(1.1, 0.05);
    const o = ctx.createOscillator();
    o.type = "sawtooth";
    const baseF = jit(120, 0.05);

    lfoFg.gain.value = baseF * 0.03;

    const f1 = ctx.createBiquadFilter();
    f1.type = "bandpass"; f1.Q.value = 4;
    f1.frequency.setValueAtTime(500, t0);
    f1.frequency.linearRampToValueAtTime(350, t0 + dur);
    const f2 = ctx.createBiquadFilter();
    f2.type = "bandpass"; f2.Q.value = 4;
    f2.frequency.setValueAtTime(900, t0);
    f2.frequency.linearRampToValueAtTime(1000, t0 + dur);

    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.20, t0 + 0.15);
    g.gain.setValueAtTime(0.20, t0 + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const mix3 = ctx.createGain(); mix3.gain.value = FORMANT_MAKEUP;
    o.connect(f1).connect(mix3); o.connect(f2).connect(mix3);
    mix3.connect(lp).connect(g);
    g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
    lfoF.start(t0); lfoF.stop(t0 + dur + 0.02);
  }
  // ぶた：ブヒッ ブヒッ ブヒッ = 3 パルス、ノイズ成分多め、ピッチ 140→200Hz の小さな上昇
  function oink() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const seq = [0, 0.16, 0.32];
    seq.forEach((off, idx) => {
      const t0 = now + off;
      const dur = 0.12;
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(jit(140, 0.06), t0);
      o.frequency.exponentialRampToValueAtTime(jit(200, 0.06), t0 + dur);
      // フォルマント（低めの真ん中 + やや高い穴）を通す
      const f1 = ctx.createBiquadFilter();
      f1.type = "bandpass"; f1.frequency.value = 700;  f1.Q.value = 4;
      const f2 = ctx.createBiquadFilter();
      f2.type = "bandpass"; f2.frequency.value = 1500; f2.Q.value = 4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      // 母音の共鳴（フォルマント）は並列に重ねる（直列だと通る音がほぼ無くなる）
      const mix4 = ctx.createGain(); mix4.gain.value = FORMANT_MAKEUP;
      o.connect(f1).connect(mix4); o.connect(f2).connect(mix4);
      mix4.connect(g);
      g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
      // ノイズ成分多め（ブヒの子音）：奇数パルスで重ねる

  // にわとり：コ・ケ・コ（短い 3 連スタッカート）＋長く上がって下がる「コー」+ ビブラート + かすれノイズ
  function cluck() {
    if (!ctx) return;
    const now = ctx.currentTime;
    // 4 セグメント（コ・ケ・コ・コー）。各セグメントの f0/f1 で音程の動き、F1/F2 でフォルマントを作る。
    // 4 番目だけビブラートとノイズを足す（声がかすれる感じ）。
    const seq = [
      { off: 0.00, dur: 0.10, f0: 880,  f1: 700,  F1: 900,  F2: 1400, vibHz: 0,  vibDepth: 0, noise: 0    },
      { off: 0.14, dur: 0.07, f0: 1100, f1: 950,  F1: 1100, F2: 1700, vibHz: 0,  vibDepth: 0, noise: 0    },
      { off: 0.24, dur: 0.10, f0: 880,  f1: 720,  F1: 900,  F2: 1400, vibHz: 0,  vibDepth: 0, noise: 0    },
      { off: 0.42, dur: 0.50, f0: 500,  f1: 950,  F1: 500,  F2: 1600, vibHz: 6,  vibDepth: 0.03, noise: 0.06 },
    ];
    seq.forEach((s, i) => {
      const t0 = now + s.off;
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      const baseF = jit(s.f1, 0.05);
      o.frequency.setValueAtTime(jit(s.f0, 0.05), t0);
      o.frequency.exponentialRampToValueAtTime(baseF, t0 + s.dur * 0.55);
      // ビブラート（4 番目だけ）
      let lfoF = null, lfoFg = null;
      if (s.vibHz > 0) {
        lfoF = ctx.createOscillator();
        lfoFg = ctx.createGain();
        lfoF.frequency.value = s.vibHz;
        lfoFg.gain.value = baseF * s.vibDepth;
        lfoF.connect(lfoFg).connect(o.frequency);
      }
      // フォルマント（F1, F2）
      const f1 = ctx.createBiquadFilter();
      f1.type = "bandpass"; f1.frequency.value = s.F1; f1.Q.value = 3.5;
      const f2 = ctx.createBiquadFilter();
      f2.type = "bandpass"; f2.frequency.value = s.F2; f2.Q.value = 3.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + s.dur);
      // 母音の共鳴（フォルマント）は並列に重ねる（直列だと通る音がほぼ無くなる）
      const mix5 = ctx.createGain(); mix5.gain.value = FORMANT_MAKEUP;
      o.connect(f1).connect(mix5); o.connect(f2).connect(mix5);
      mix5.connect(g);
      g.connect(master);
      o.start(t0); o.stop(t0 + s.dur + 0.02);
      if (lfoF) { lfoF.start(t0); lfoF.stop(t0 + s.dur + 0.02); }
      // かすれノイズ（4 番目のコーの頭に 1 回）
      if (s.noise > 0) noiseBurst(t0, 0.08, s.noise, 1400);
    });
  }
  // ひつじ：メェ〜 0.9s, pitch≈420Hz, 速いビブラート（LFO 24Hz, 深さ 6%）で震える声, エ母音 + 鼻声
  function baa() {

    f2.type = "bandpass"; f2.frequency.value = 1800; f2.Q.value = 5;

    lp.type = "lowpass"; lp.frequency.value = 1700;

    g.gain.exponentialRampToValueAtTime(0.20, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const mix6 = ctx.createGain(); mix6.gain.value = FORMANT_MAKEUP;
    o.connect(f1).connect(mix6); o.connect(f2).connect(mix6);
    mix6.connect(lp).connect(g);
    g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
    lfoF.start(t0); lfoF.stop(t0 + dur + 0.02);
  }
  // うま：ヒヒーン 1.1s, 650→1250→700Hz ポルタメント + ビブラート + わずかなノイズ

  }
  // かえる：ゲロゲロ = 2 グループ（off=0, 0.30）, 低い 180Hz パルスを振幅 LFO (14Hz) で刻む, bandpass 900Hz こもった音

  // あひる：ガーガー 2 発, sawtooth 330→280Hz, 鼻にかかった「ア」フォルマント（F1=800 F2=1200）+ lowpass, ビブラートなし
  function quack() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [0, 0.30].forEach(off => {
      const t0 = now + off;
      const dur = jit(0.25, 0.06);
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(jit(330, 0.05), t0);
      o.frequency.exponentialRampToValueAtTime(jit(280, 0.05), t0 + dur * 0.7);
      // 鼻にかかった「ア」フォルマント
      const fA1 = ctx.createBiquadFilter();
      fA1.type = "bandpass"; fA1.frequency.value = 800;  fA1.Q.value = 5;
      const fA2 = ctx.createBiquadFilter();
      fA2.type = "bandpass"; fA2.frequency.value = 1200; fA2.Q.value = 5;
      // lowpass でさらに鼻にかかった感じを出す
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 1300;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      // 母音の共鳴（フォルマント）は並列に重ねる（直列だと通る音がほぼ無くなる）
      const mix8 = ctx.createGain(); mix8.gain.value = FORMANT_MAKEUP;
      o.connect(fA1).connect(mix8); o.connect(fA2).connect(mix8);
      mix8.connect(lp).connect(g);
      g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    });
  }
  // らいおん：ガオー 1.0s, 低い sawtooth（110→85Hz）+ 「オ」→「ア」フォルマント（F1 500→700 F2 900→1200）
//          + 振幅 LFO 25Hz（唸り: tremolo）+ 立ち上がりに大きなノイズバースト
  function roar() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const t0 = now;
    const dur = jit(1.0, 0.05);
    const o = ctx.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(jit(110, 0.05), t0);
    o.frequency.exponentialRampToValueAtTime(jit(85, 0.05), t0 + dur * 0.6);
    // フォルマント「オ」→「ア」
    const f1 = ctx.createBiquadFilter();
    f1.type = "bandpass"; f1.Q.value = 4;
    f1.frequency.setValueAtTime(500, t0);
    f1.frequency.linearRampToValueAtTime(700, t0 + dur * 0.4);
    const f2 = ctx.createBiquadFilter();
    f2.type = "bandpass"; f2.Q.value = 4;
    f2.frequency.setValueAtTime(900, t0);
    f2.frequency.linearRampToValueAtTime(1200, t0 + dur * 0.4);
    // 振幅 LFO 25Hz（唸り）→ gain.gain に接続
    const lfoA = ctx.createOscillator();
    const lfoAg = ctx.createGain();
    lfoA.frequency.value = 25;
    lfoAg.gain.value = 0.12;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.10);
    lfoA.connect(lfoAg).connect(g.gain);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    // 母音の共鳴（フォルマント）は並列に重ねる（直列だと通る音がほぼ無くなる）
    const mix9 = ctx.createGain(); mix9.gain.value = FORMANT_MAKEUP;
    o.connect(f1).connect(mix9); o.connect(f2).connect(mix9);
    mix9.connect(g);
    g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
    lfoA.start(t0); lfoA.stop(t0 + dur + 0.02);
    // 立ち上がりに大きなノイズバースト
    noiseBurst(t0, 0.10, 0.18, 1200);
  }

  /* --------------- 効果音 --------------- */
  // おしまい音：下降する3音の鈴（最大 gain 0.20、master 0.22 通過後に 0.044）
  function finishTone() {
    if (!ctx || !acquireVoice(500)) return;
    ensureRunning();
    const now = ctx.currentTime;
    // 880 → 698 → 523（A5 → F5 → C5）三角波、各 0.18s 間隔
    [880, 698, 523].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      const t0 = now + i * 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.20, t0 + 0.02);  // 単音ピーク 0.20 ≦ 0.25
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g).connect(master);
      o.start(t0); o.stop(t0 + 0.36);
    });
  }
  // 破裂音（風船）
  function pop() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3) * 0.9;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(2200, now);
    lp.frequency.exponentialRampToValueAtTime(400, now + 0.20);
    const g = ctx.createGain();
    g.gain.value = 0.30;
    src.connect(lp).connect(g).connect(master);
    src.start(now); src.stop(now + 0.25);
  }
  // きらきら（高めのベル）
  function twinkle() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [1200, 1500, 1800].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i * 0.04);
      g.gain.exponentialRampToValueAtTime(0.12, now + i * 0.04 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.04 + 0.18);
      o.connect(g).connect(master);
      o.start(now + i * 0.04); o.stop(now + i * 0.04 + 0.22);
    });
  }

  /* --------------- 鳴き声テーブル --------------- */
  // 絵文字 / 鳴き声ラベル（読み上げ廃止により read フィールドは削除）
  const animals = [
    {emo:"🐶", vol:0.45, sound:"わんわん",       fn: bark  },
    {emo:"🐱", vol:1.0, sound:"にゃーにゃー",   fn: meow  },
    {emo:"🐮", vol:0.4, sound:"もーもー",       fn: moo   },
    {emo:"🐷", vol:0.65, sound:"ぶーぶー",       fn: oink  },
    {emo:"🐔", vol:0.4, sound:"こけこっこー",   fn: cluck },
    {emo:"🐑", vol:0.5, sound:"めーめー",       fn: baa   },
    {emo:"🐴", vol:1.1, sound:"ひひーん",       fn: neigh },
    {emo:"🐸", vol:3.2, sound:"げろげろ",       fn: croak },
    {emo:"🦆", vol:0.55, sound:"がーがー",       fn: quack },
    {emo:"🦁", vol:0.35, sound:"がおー",         fn: roar  },
  ];

  // 本物の録音（Wikimedia Commons の CC0 / パブリックドメイン / CC BY-SA。出典は CREDITS.md）
  const ANIMAL_FILES = ["dog","cat","cow","pig","chicken","sheep","horse","frog","duck","lion"];
  const ANIMAL_SAMPLE_GAIN = 1.6;   // 録音は -16 LUFS に揃えてあり、master(0.22) と合わせてこの値
  const animalBuffers = {};
  let animalLoading = false;
  function loadAnimalSamples() {
    if (!ctx || animalLoading) return;
    animalLoading = true;
    ANIMAL_FILES.forEach((name, i) => {
      fetch("sounds/" + name + ".mp3")
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
        .then(ab => new Promise((ok, ng) => ctx.decodeAudioData(ab, ok, ng)))   // 古い Safari 用にコールバック形式
        .then(buf => { animalBuffers[i] = buf; })
        .catch(err => console.warn("[audio] sample load failed:", name, err));
    });
  }
  function playAnimalSample(idx) {
    const buf = animalBuffers[idx];
    if (!buf) return false;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 0.97 + Math.random() * 0.07;   // 毎回ほんの少し違う高さ
    const g = ctx.createGain(); g.gain.value = ANIMAL_SAMPLE_GAIN;
    src.connect(g).connect(master);
    src.start();
    return true;
  }

  function playAnimal(idx) {
    const a = animals[idx];
    if (!a) return;
    ensureRunning();
    // 鳴き声の最長は lion/chicken ≒ 3s。acquireVoice 内の setTimeout が自動で解放するので、手動の releaseVoice は呼ばない
    const sb = animalBuffers[idx];
    if (!acquireVoice(sb ? sb.duration * 1000 + 100 : 1200)) return;
    if (ctx && master && playAnimalSample(idx)) return;   // 録音が読めていればそれを鳴らす。未読込なら下の合成音にフォールバック
    // 動物ごとの音量補正（フォルマント並列後の実測値で揃えた）。master を一時的に差し替えて鳴らす
    if (!ctx || !master) return;
    const savedMaster = master;
    const bus = ctx.createGain(); bus.gain.value = a.vol || 1; bus.connect(savedMaster);
    master = bus;
    try { a.fn(); } finally { master = savedMaster; }   // 合成音（即時）のみ。読み上げは廃止。
  }
  function playPop()  {
    ensureRunning();
    // acquireVoice 内の setTimeout が自動で解放する（二重解放しない）
    if (!acquireVoice(300)) return;
    pop();
  }
  function playTwinkle() {
    ensureRunning();
    // playTwinkle が発音の入口、ここ 1 回だけ acquire。twinkle() 内部では acquire しない
    if (!acquireVoice(300)) return;
    twinkle();
  }

  /* --------------- カラー：ペンタトニック (C4 D4 E4 G4 A4) --------------- */
  // x 座標 [0..1] を 5 区分
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00];
  function noteForX(xNorm) {
    const n = Math.max(0, Math.min(scale.length - 1, Math.floor(xNorm * scale.length)));
    return scale[n];
  }
  function playNote(freq, dur = 0.35, gain = 0.22) {
    if (!ctx) return;
    ensureRunning();   // ctx が止まっている場合に resume を試す（音が出ない時の保険）
    // 倍音(o2)含めて 1 note = 1 voice として数える（発音の入口で 1 回だけ acquire）
    // 解放は acquireVoice 内の setTimeout に任せる（手動で releaseVoice を呼ばない）
    if (!acquireVoice(Math.ceil((dur + 0.3) * 1000))) return;
    const o = ctx.createOscillator();
    o.type = "triangle";
    o.frequency.value = freq;
    envOsc(o, ctx.currentTime, dur, gain, 0.01, 0.06);
    // 倍音を薄く重ねて柔らかく
    const o2 = ctx.createOscillator();
    o2.type = "sine";
    o2.frequency.value = freq * 2;
    envOsc(o2, ctx.currentTime, dur, gain * 0.4, 0.01, 0.06);
  }
  function playNoteSmall(freq) {
    playNote(freq, 0.18, 0.16);
  }

  /* --------------- おとあそび：半音階 13 音（C4〜C5） --------------- */
  // 実際の鍵盤の 1 オクターブ分。インデックスは音名順に固定
  // （0=C4,1=C#4,2=D4,3=D#4,4=E4,5=F4,6=F#4,7=G4,8=G#4,9=A4,10=A#4,11=B4,12=C5）。
  // DOM の各鍵の data-note がこのインデックスと 1 対 1 で対応する。
  const musicScale = [
    261.63,  //  0  C4   ド
    277.18,  //  1  C#4
    293.66,  //  2  D4   レ
    311.13,  //  3  D#4
    329.63,  //  4  E4   ミ
    349.23,  //  5  F4   ファ
    369.99,  //  6  F#4
    392.00,  //  7  G4   ソ
    415.30,  //  8  G#4
    440.00,  //  9  A4   ラ
    466.16,  // 10  A#4
    493.88,  // 11  B4   シ
    523.25,  // 12  C5   高いド
  ];
  function playMusicNote(idx, dur = 0.6) {
    if (!ctx) return;
    const freq = musicScale[idx];
    if (freq == null) return;
    // playNote と同じ envelope で、durations だけ長め。発音の入口で 1 回だけ acquire。
    // 倍音(o2)も 1 note = 1 voice として数える設計に揃えるため playNote をそのまま呼ぶ
    playNote(freq, dur, 0.18);
  }

  /* --------------- のりもの：擬音 --------------- */
  // 車：ブッブー = 低い矩形波を 2 発
  function hornCar() {
    if (!ctx) return;
    if (!acquireVoice(800)) return;
    const now = ctx.currentTime;
    [0, 0.22].forEach(off => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(330, now + off);
      o.frequency.setValueAtTime(330, now + off + 0.10);
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.16, now + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.16);
      o.connect(g).connect(master);
      o.start(now + off); o.stop(now + off + 0.20);
    });
  }
  // バス：プップー = やや高めの矩形波 2 発
  function hornBus() {
    if (!ctx) return;
    if (!acquireVoice(800)) return;
    const now = ctx.currentTime;
    [0, 0.24].forEach(off => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(440, now + off);
      o.frequency.setValueAtTime(440, now + off + 0.12);
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.16, now + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.16);
      o.connect(g).connect(master);
      o.start(now + off); o.stop(now + off + 0.20);
    });
  }
  // 電車：ガタンゴトン = 低音を「ガタン」「ガタン」と 2 回刻む
  function hornTrain() {
    if (!ctx) return;
    if (!acquireVoice(1000)) return;
    const now = ctx.currentTime;
    // 4 ヒット: ガ・タン・ゴ・トン。低→高→低→高
    const seq = [
      {t:0.00, f:180, d:0.10, g:0.20},
      {t:0.14, f:520, d:0.06, g:0.14},
      {t:0.32, f:180, d:0.10, g:0.20},
      {t:0.46, f:520, d:0.06, g:0.14},
    ];
    seq.forEach(s => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "square";
      o.frequency.value = s.f;
      g.gain.setValueAtTime(0.0001, now + s.t);
      g.gain.exponentialRampToValueAtTime(s.g, now + s.t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + s.t + s.d);
      o.connect(g).connect(master);
      o.start(now + s.t); o.stop(now + s.t + s.d + 0.02);
    });
  }
  // 消防車：ウーウー = 低いサイン波のポルタメント（上→下）
  function hornFire() {
    if (!ctx) return;
    if (!acquireVoice(1200)) return;
    const now = ctx.currentTime;
    [0, 0.42].forEach(off => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(620, now + off);
      o.frequency.exponentialRampToValueAtTime(380, now + off + 0.35);
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.18, now + off + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.40);
      o.connect(g).connect(master);
      o.start(now + off); o.stop(now + off + 0.42);
    });
  }
  // パトカー：ピーポー = 高低交互（先細切形）
  function hornPolice() {
    if (!ctx) return;
    if (!acquireVoice(1100)) return;
    const now = ctx.currentTime;
    // ピ(高)→ポー(低)→ピ(高)→ポー(低)、計 4 発
    const seq = [
      {t:0.00, f:880,  d:0.10},
      {t:0.20, f:620,  d:0.20},
      {t:0.50, f:880,  d:0.10},
      {t:0.70, f:620,  d:0.20},
    ];
    seq.forEach(s => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "square";
      o.frequency.value = s.f;
      g.gain.setValueAtTime(0.0001, now + s.t);
      g.gain.exponentialRampToValueAtTime(0.16, now + s.t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + s.t + s.d);
      o.connect(g).connect(master);
      o.start(now + s.t); o.stop(now + s.t + s.d + 0.02);
    });
  }
  // トラクター：ブルルル = 低めのこぎり波を連続
  function hornTractor() {
    if (!ctx) return;
    if (!acquireVoice(900)) return;
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    o.type = "sawtooth";
    o.frequency.value = 110;
    lp.type = "lowpass"; lp.frequency.value = 600;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.18, now + 0.06);
    g.gain.setValueAtTime(0.18, now + 0.60);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.80);
    o.connect(lp).connect(g).connect(master);
    o.start(now); o.stop(now + 0.85);
  }

  // 乗り物の絵文字と擬音の対応（タップのたびに別の絵文字へ変えて OK なのでシャッフル利用）
  const vehicles = [
    { emo:"🚗", name:"くるま",   fn: hornCar    },
    { emo:"🚌", name:"バス",     fn: hornBus    },
    { emo:"🚃", name:"でんしゃ", fn: hornTrain  },
    { emo:"🚒", name:"しょうぼうしゃ", fn: hornFire    },
    { emo:"🚓", name:"パトカー", fn: hornPolice },
    { emo:"🚜", name:"トラクター", fn: hornTractor },
  ];
  function playVehicleSound(kind) {
    const v = vehicles[kind];
    if (!v) return;
    ensureRunning();
    v.fn();
  }

  return {
    unlock, tryResume,
    playAnimal, playPop, playTwinkle, finishTone,
    noteForX, playNote, playNoteSmall,
    playMusicNote, musicScale,
    playVehicleSound, vehicles,
    animals,
  };
})();

/* =====================================================================
   音声アンロックのグローバル監視
   - iOS Safari（実機 iPad）は pointerdown / touchstart の中では AudioContext の
     ロックを解除しないことがある。確実に許可されるのは touchend / pointerup / click
     の中なので、どこからタップが飛んで来ても capture:true で拾って
     SoundKit.unlock() を呼ぶ。
   - preventDefault はしない（passive:true）。既存の各モードのハンドラも邪魔しない。
   - unlock() 自体は ctx.state === "running" になるまで何度でも試すが、
     running になった後は重い処理は飛ばすので、毎タップで呼んでも軽い。
   - 以前は speechSynthesis のロック解除も同じ仕組みで必要だったが、読み上げを
     廃止したため AudioContext のみ気にすればよくなった。
   ===================================================================== */
function safeUnlockAudio() {
  try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
}
function safeResumeAudio() {
  try { SoundKit.tryResume(); } catch (err) { console.warn("[audio] tryResume failed:", err); }
}
["pointerdown", "pointerup", "touchstart", "touchend", "click"].forEach(type => {
  window.addEventListener(type, safeUnlockAudio, {capture: true, passive: true});
});
// 裏→表復帰・ページ復帰・フォーカス復帰で止まっていた AudioContext を起こす
//（tryResume は state が running でなければ何もしないので軽い）
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") safeResumeAudio();
});
window.addEventListener("pageshow",  safeResumeAudio);
window.addEventListener("focus",    safeResumeAudio);

/* =====================================================================
   手のひら判定（現在 常時 false = 無効）
   - 実機 iPad Safari で「🏠ボタンとホームのカード以外、タップが全く反応しない」症状があり、
     原因はここで指を掌と誤判定していたこと。PointerEvent.width / height は iPad では
     指でタップしても 60px を超える大きな値が出て、全タップが「掌」として捨てられていた。
   - 幼児が掌で叩いても反応する方が弊害がないため、サイズによる判定は行わない。
   - 呼び出し側の 8 か所はそのまま（常に false が返るので素通りする）。
   - PALM_THRESHOLD は参考値として残す（今後判定を復活させる場合に使う）。
   ===================================================================== */
const PALM_THRESHOLD = 60;   // 参考値（現在は判定に使用していない）
function isPalmTouch(e) {
  return false;
}

/* =====================================================================
   パーティクル共通
   ===================================================================== */
function spawnParticles(x, y, color, count = 24) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 220;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 80,
      life: 0,
      ttl: 0.9 + Math.random() * 0.6,   // 0.9〜1.5 秒
      // 短辺の 0.8〜1.4 vmin（描画時に vminUnit を掛ける）
      size: 0.8 + Math.random() * 0.6,
      color,
    });
  }
}
const particles = [];
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 320 * dt;     // 重力
    p.vx *= 0.985;
    if (p.life >= p.ttl) particles.splice(i, 1);
  }
}
function drawParticles(ctx2d) {
  // 短辺の 1/100 = 1vmin。resize / orientationchange に追従する
  const u = Math.min(window.innerWidth, window.innerHeight) / 100;
  ctx2d.save();
  for (const p of particles) {
    const a = 1 - p.life / p.ttl;
    ctx2d.globalAlpha = Math.max(0, a);
    ctx2d.fillStyle = p.color;
    ctx2d.beginPath();
    ctx2d.arc(p.x, p.y, p.size * u, 0, Math.PI * 2);
    ctx2d.fill();
  }
  ctx2d.restore();
}

/* =====================================================================
   タイマー設定（親用：ホーム右上の⏱ボタン）
   - 値: 0=なし, 5, 10, 15, 20 (分)
   - localStorage に保存（キー baby-tap.timerMin）、try/catch で例外を握り潰さない
   - URL パラメータ ?timersec=N でテスト用に秒数で動作
   ===================================================================== */
const TimerConfig = (() => {
  const KEY = "baby-tap.timerMin";
  const VALUES = [0, 5, 10, 15, 20];     // 0 = なし
  let current = 0;

  function getURLSecOverride() {
    try {
      const params = new URLSearchParams(location.search);
      const v = params.get("timersec");
      if (v == null) return null;
      const n = parseInt(v, 10);
      if (!Number.isFinite(n) || n <= 0) return null;
      return n;
    } catch (err) {
      console.warn("[timer] URL parse failed:", err);
      return null;
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw == null) return 0;
      const n = parseInt(raw, 10);
      if (!Number.isFinite(n) || !VALUES.includes(n)) return 0;
      return n;
    } catch (err) {
      console.warn("[timer] load failed:", err);
      return 0;
    }
  }

  function save(n) {
    try {
      localStorage.setItem(KEY, String(n));
    } catch (err) {
      console.warn("[timer] save failed:", err);
    }
  }

  function init() {
    current = load();
    const sec = getURLSecOverride();
    if (sec != null) {
      console.log(`[timer] debug mode: limit = ${sec} sec (URL override)`);
    } else if (current === 0) {
      console.log("[timer] disabled (no setting)");
    } else {
      console.log(`[timer] limit = ${current} min`);
    }
  }

  function get() { return current; }                       // 0,5,10,15,20
  function getDisplay() { return current === 0 ? "なし" : String(current); }
  function getLimitMs() {
    const sec = getURLSecOverride();
    if (sec != null) return sec * 1000;
    return current === 0 ? 0 : current * 60 * 1000;
  }
  function next() {
    const i = VALUES.indexOf(current);
    current = VALUES[(i + 1) % VALUES.length];
    save(current);
    return current;
  }

  return { init, get, getDisplay, getLimitMs, next, getURLSecOverride };
})();

/* =====================================================================
   プレイ時間タイマー（モード画面の表示中だけ加算）
   - ホーム滞在は数えない
   - visibilitychange で hidden の間は止める
   - finished=true で重ね打ち防止
   ===================================================================== */
const playTimer = {
  cumulativeMs: 0,           // モード画面に居た時間の合計
  inModeStartMs: 0,           // 現在のモードに入った時刻（performance.now）
  pausedAtMs: null,           // 非表示で停止した時刻（null なら停止していない）
  inMode: false,              // モード画面が表示されているか
  finished: false,             // おしまいに到達済みか（二重防止）
  limitMs: 0,                 // 現在の設定値（ミリ秒）
};

// モード画面に入った（home / finish 以外）
function onEnterMode(now) {
  playTimer.inMode = true;
  playTimer.inModeStartMs = now;
}

// モード画面から抜けた（累計をコミットメント）
function onLeaveMode(now) {
  if (playTimer.inMode) {
    playTimer.cumulativeMs += now - playTimer.inModeStartMs;
  }
  playTimer.inMode = false;
}

// 現在の累計加算
function currentElapsedMs(now) {
  if (playTimer.pausedAtMs != null) {
    // 一時停止中：cumulativeMs のまま（inModeStartMs は進めてある）
    return playTimer.cumulativeMs;
  }
  if (playTimer.inMode) {
    return playTimer.cumulativeMs + (now - playTimer.inModeStartMs);
  }
  return playTimer.cumulativeMs;
}

function onVisibilityHidden(now) {
  // モード画面にいるときだけ停止対象
  if (playTimer.pausedAtMs == null && playTimer.inMode) {
    // 停止時点の累計を確定
    playTimer.cumulativeMs += now - playTimer.inModeStartMs;
    playTimer.pausedAtMs = now;
  }
}

function onVisibilityVisible(now) {
  if (playTimer.pausedAtMs != null) {
    // 再開：inModeStartMs を now にして、cumulativeMs に pauseDur を加えない
    // → 結果として「止まっていた時間ぶん」進まないように見える（仕様に従う）
    playTimer.inModeStartMs = now;
    playTimer.pausedAtMs = null;
  }
}

function resetCumulative() {
  const now = performance.now();
  playTimer.cumulativeMs = 0;
  playTimer.inModeStartMs = now;
  playTimer.pausedAtMs = null;
  // inMode / finished は呼び出し側で制御
}

function triggerFinish(now) {
  if (playTimer.finished) return;
  playTimer.finished = true;
  // 累計を確定（inMode = false にして加算を止める）
  if (playTimer.inMode) {
    playTimer.cumulativeMs += now - playTimer.inModeStartMs;
  }
  playTimer.inMode = false;
  // 終了音 → フェードでおしまい画面へ（読み上げは廃止）
  SoundKit.finishTone();
  fadeThenFinish();
}

/* =====================================================================
   モード管理
   ===================================================================== */
const stages = {
  home:    document.getElementById("stage-home"),
  animal:  document.getElementById("stage-animal"),
  balloon: document.getElementById("stage-balloon"),
  color:   document.getElementById("stage-color"),
  music:   document.getElementById("stage-music"),
  vehicle: document.getElementById("stage-vehicle"),
  draw:    document.getElementById("stage-draw"),
  finish:  document.getElementById("stage-finish"),
};
let currentMode = "home";

// 現在のモードで有効な resize ハンドラ（モード切替時に外す）
let activeResize = null;
function bindResize(onResize) {
  if (activeResize) {
    window.removeEventListener("resize", activeResize);
    window.removeEventListener("orientationchange", activeResize);
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  activeResize = onResize;
}

function showMode(mode) {
  const now = performance.now();
  // 直前モードを保持（累計リセット条件の判定に使う）
  const previousMode = currentMode;
  // 前のモードの計測をコミット
  onLeaveMode(now);

  currentMode = mode;
  for (const k of Object.keys(stages)) {
    stages[k].classList.toggle("active", k === mode);
  }
  // モード切替時に粒子をクリア（前のモードのきらきらを残さない）
  particles.length = 0;

  // 累計リセットは「finish → home」のときだけ。
  // 通常のモード → home では累計を維持（ホーム滞在中は inMode=false なので加算されない）。
  // ⏱での設定変更時は setupTimerButton 側で別途リセットする。
  if (mode === "home" && previousMode === "finish") {
    resetCumulative();
    playTimer.finished = false;
  }

  // 表示が反映されてから初期化（clientWidth が 0 のまま resize されるのを防ぐ）
  requestAnimationFrame(() => {
    if (mode === "animal")  initAnimal();
    if (mode === "balloon") initBalloon();
    if (mode === "color")   initColor();
    if (mode === "music")   initMusic();
    if (mode === "vehicle") initVehicle();
    if (mode === "draw")    initDraw();
    // finish は init 不要（DOM は静的）
  });

  // 新しいモードが「計測対象」なら開始
  if (mode === "animal" || mode === "balloon" || mode === "color" ||
      mode === "music"  || mode === "vehicle" || mode === "draw") {
    onEnterMode(performance.now());
  }
}

/* ---- おしまいに遷移：フェード → ステージ切替 → フェードイン ---- */
function fadeThenFinish() {
  document.body.classList.add("fading");
  setTimeout(() => {
    showMode("finish");
    // 次のフレームでフェードイン開始（合計 約2秒のアニメ）
    requestAnimationFrame(() => {
      document.body.classList.remove("fading");
    });
  }, 1000);
}

/* =====================================================================
   長押しボタン共通：1.5 秒長押しで進捗リング
   - 🏠 と ⏱ の両方で使用（描画色は呼び出し側で指定可）
   - 既存の setupHomeButtons の中身を移植
   ===================================================================== */
function setupHoldButton(btn, onLongPress, opts) {
  const HOLD_MS = (opts && opts.holdMs)    || 1500;
  const COLOR   = (opts && opts.ringColor) || "#e34";
  const cv = btn.querySelector("canvas");
  // ボタン幅は clamp(72px, 11vmin, 120px) で変動する。毎フレーム clientWidth を見る方式に変える
  let ctx2d = null;
  let timer = null;        // setInterval の id（リング再描画用）
  let holdTimer = null;    // setTimeout の id（HOLD_MS で発火用）
  let start = 0;
  let locked = false;

  function rebuildCanvas() {
    // 現在のボタン幅で canvas を再構築（resize / orientationchange に追従）
    const cssSize = btn.clientWidth || 72;
    ctx2d = setupHiDPICanvas(cv, cssSize);
  }
  rebuildCanvas();
  // ボタンサイズが変わったらリング用 canvas も作り直す（Stage Manager / 分割表示対応）
  if (typeof ResizeObserver !== "undefined") {
    const ro = new ResizeObserver(() => {
      rebuildCanvas();
      if (locked) drawRing();
    });
    ro.observe(btn);
  }

  function drawRing() {
    if (!ctx2d) return;
    const w = cv.clientWidth;
    // ボタンが非表示（display:none 等）で clientWidth が 0 や極端に小さいとき、
    // lineW（最低 3px）と合わせて arc 半径が負になり IndexSizeError になる。
    // 線幅 lineW = max(3, w*0.08) なので、半径が負になるのは w < 2*lineW のとき。
    const lineW0 = Math.max(3, w * 0.08);
    if (w <= lineW0 * 2) return;
    ctx2d.clearRect(0, 0, cv.width, cv.height);
    if (!locked) return;
    const elapsed = performance.now() - start;
    const t = Math.min(1, elapsed / HOLD_MS);
    // setupHiDPICanvas で既に scale(dpr,dpr) 済みなので、ここでは再 scale しない
    ctx2d.save();
    // 線幅もボタンサイズに比例（vmin ベース）
    const lineW = lineW0;
    ctx2d.lineWidth = lineW;
    ctx2d.strokeStyle = COLOR;
    ctx2d.beginPath();
    ctx2d.arc(w/2, w/2, w/2 - lineW, -Math.PI/2, -Math.PI/2 + Math.PI*2*t);
    ctx2d.stroke();
    ctx2d.restore();
  }
  function startHold() {
    // 音/全画面の準備で例外が出ても、絵・音のメイン処理は必ず走るよう try/catch で囲う
    try { SoundKit.unlock(); } catch (err) { console.warn("[audio] unlock failed:", err); }
    try { tryFullscreen(); } catch (err) { console.warn("[fullscreen] failed:", err); }
    locked = true;
    start = performance.now();
    btn.classList.add("locked");
    document.body.classList.add("home-locking");   // 他タップ抑止
    drawRing();
    timer = setInterval(drawRing, 16);
    holdTimer = setTimeout(() => {
      if (locked) {
        // onLongPress() でホームへ戻るとボタンが display:none になり、ResizeObserver→rebuildCanvas→drawRing が走る。
        // そのとき drawRing の arc 半径が負にならないよう、先に locked を解除しておく。
        locked = false;
        clearInterval(timer);
        timer = null;
        document.body.classList.remove("home-locking");
        // CSS は .home-btn(locked) の背景色を変えているので、ここで解除
        btn.classList.remove("locked");
        if (ctx2d) ctx2d.clearRect(0, 0, cv.width, cv.height);
        onLongPress();
      }
    }, HOLD_MS);
  }
  function cancelHold() {
    locked = false;
    btn.classList.remove("locked");
    document.body.classList.remove("home-locking");
    // 離して素早く押し直しても 1.5 秒未満で戻らないよう、両方のタイマーを止める
    if (timer)     { clearInterval(timer);   timer = null; }
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (ctx2d) ctx2d.clearRect(0, 0, cv.width, cv.height);
  }
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    // pointer capture：home-locking でボタン側が pointer-events:none になっても
    // pointerup / pointercancel / lostpointercapture がボタンに届くようにする
    try { btn.setPointerCapture(e.pointerId); } catch (_) { /* 取得失敗は無視 */ }
    startHold();
  });
  btn.addEventListener("pointerup",   e => { e.preventDefault(); cancelHold(); });
  btn.addEventListener("pointercancel",e => cancelHold());
  // capture が外れた場合（OS が強制的に奪った等）にも確実にキャンセル
  btn.addEventListener("lostpointercapture", () => cancelHold());
  btn.addEventListener("pointermove", e => {
    // 指がボタン外に出たらキャンセル
    const r = btn.getBoundingClientRect();
    const x = e.clientX, y = e.clientY;
    if (x < r.left || x > r.right || y < r.top || y > r.bottom) cancelHold();
  });
  btn.addEventListener("click", e => e.preventDefault());
}

function setupHomeButtons() {
  document.querySelectorAll(".home-btn").forEach(btn => {
    setupHoldButton(btn, () => {
      showMode("home");
    });
  });
}
